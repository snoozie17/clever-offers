<sc-for list=\"{{ agentHomeowners }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px 24px\">\n              <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px\">\n                <div style=\"width:46px;height:46px;border-radius:50%;background:#EAF1FC;color:#1366D6;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:16px;flex:none\">{{ h.initials }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\"><div style=\"font-family:'Poppins';font-weight:600;font-size:17px\">{{ h.name }}<\u002Fdiv><div style=\"font-size:13px;color:#8593ab\">{{ h.address }} · {{ h.city }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:11.5px;font-weight:700;color:{{ h.agrColor }};background:{{ h.agrBg }};padding:3px 10px;border-radius:20px\">{{ h.agrShort }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px;font-size:14px\">\n                <div style=\"display:flex;align-items:center;gap:9px;color:#51607A\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 5.5C3 4 4 3 5.5 3H7l2 5-2.2 1.5a12 12 0 0 0 5.7 5.7L14 13l5 2v1.5C19 18 18 19 16.5 19 9 19 3 13 3 5.5z\" fill=\"#8593ab\"><\u002Fpath><\u002Fsvg>{{ h.phone }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;color:#51607A\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\" stroke=\"#8593ab\" stroke-width=\"2\"><\u002Frect><path d=\"M4 7l8 6 8-6\" stroke=\"#8593ab\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>{{ h.email }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <input value=\"{{ h.msgVal }}\" oninput=\"{{ h.onMsg }}\" placeholder=\"Send a quick message…\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:9px;padding:10px 13px;font-size:14px\" style-focus=\"border-color:#1366D6\">\n                <button onclick=\"{{ h.sendMsg }}\" style=\"background:#1366D6;color:#fff;border:none;padding:10px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Send<\u002Fbutton>\n              <\u002Fdiv>\n              <div onclick=\"{{ h.openThread }}\" style=\"margin-top:10px;font-size:13px;font-weight:600;color:#1366D6;cursor:pointer\">Open full conversation →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noHomeowners }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"text-align:center;padding:50px 20px;color:#8593ab\">No homeowners yet.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- MESSAGES -->\n      <sc-if value=\"{{ agentMessagesActive }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:34px 40px 60px;width:100%\">\n        <div style=\"margin-bottom:8px\"><span style=\"font-size:13px;font-weight:600;color:#1366D6;letter-spacing:.4px\">AGENT PORTAL<\u002Fspan><\u002Fdiv>\n        <h1 style=\"font-family:'Poppins';font-weight:700;font-size:30px;margin:0 0 4px;letter-spacing:-.5px\">Messages<\u002Fh1>\n        <p style=\"color:#51607A;font-size:15.5px;margin:0 0 24px\">Message your sellers and investors directly.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:300px 1fr;background:#fff;border:1px solid #E4E9F1;border-radius:16px;overflow:hidden;height:560px\">\n          <div style=\"border-right:1px solid #EEF2F8;overflow-y:auto\">\n            <sc-for list=\"{{ agentContacts }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div onclick=\"{{ c.select }}\" style=\"display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;border-bottom:1px solid #F5F7FB;background:{{ c.rowBg }}\" style-hover=\"background:#F5F9FF\">\n                <div style=\"width:40px;height:40px;border-radius:50%;background:{{ c.tint }};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:14px;flex:none\">{{ c.initials }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\"><div style=\"font-weight:600;font-size:14.5px\">{{ c.name }}<\u002Fdiv><div style=\"font-size:12px;color:#8593ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.sub }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;min-width:0\">\n            <sc-if value=\"{{ hasActiveThread }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:16px 22px;border-bottom:1px solid #EEF2F8;font-family:'Poppins';font-weight:700;font-size:16px\">{{ activeContact.name }}<span style=\"font-weight:500;font-size:13px;color:#8593ab;margin-left:8px\">{{ activeContact.sub }}<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:10px;background:#FAFCFF\">\n                <sc-for list=\"{{ activeThreadMsgs }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;justify-content:{{ m.rowJustify }}\"><div style=\"max-width:70%;background:{{ m.bubbleBg }};color:{{ m.bubbleColor }};border:1px solid {{ m.bubbleBorder }};padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45\">{{ m.text }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ threadEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"text-align:center;color:#a4afc2;font-size:13px;margin:auto\">No messages yet. Say hello.<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding:14px 18px;border-top:1px solid #EEF2F8;display:flex;gap:10px\">\n                <input value=\"{{ agentComposer }}\" oninput=\"{{ onAgentComposer }}\" placeholder=\"Type a message…\" style=\"flex:1;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:11px 14px;font-size:14px\" style-focus=\"border-color:#1366D6\">\n                <button onclick=\"{{ sendComposer }}\" style=\"background:#1366D6;color:#fff;border:none;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Send<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noActiveThread }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"flex:1;display:flex;align-items:center;justify-content:center;color:#a4afc2;font-size:14px\">Select a conversation to start messaging.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- LISTING PACKAGE BUILDER (full-screen guided wizard) -->\n    <sc-if value=\"{{ pkgEditorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;z-index:130;background:#F5F8FC;display:flex;flex-direction:column\">\n        <!-- header + stepper -->\n        <div style=\"background:#fff;border-bottom:1px solid #E4E9F1;flex:none\">\n          <div style=\"max-width:900px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:16px\">\n            <div style=\"flex:1\"><div style=\"font-family:'Poppins';font-weight:700;font-size:19px\">Listing Package Builder<\u002Fdiv><div style=\"color:#51607A;font-size:13.5px\">{{ pkgSeller.name }} · target build time under 15 min<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:none;text-align:right\">\n              <div style=\"display:flex;align-items:center;gap:8px;justify-content:flex-end\"><span style=\"font-size:12px;color:#8593ab\">Quality<\u002Fspan><span style=\"font-family:'Poppins';font-weight:800;font-size:18px;color:{{ qualityColor }}\">{{ quality }}/100<\u002Fspan><\u002Fdiv>\n              <div style=\"width:130px;height:6px;border-radius:5px;background:#EEF2F8;overflow:hidden;margin-top:4px\"><div style=\"height:100%;width:{{ quality }}%;background:{{ qualityColor }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <span onclick=\"{{ closePkgEditor }}\" style=\"cursor:pointer;color:#8593ab;font-size:22px;line-height:1;margin-left:8px\">✕<\u002Fspan>\n          <\u002Fdiv>\n          <div data-m=\"stepper\" style=\"max-width:900px;margin:0 auto;padding:0 32px 16px;display:flex;align-items:center;gap:6px\">\n            <sc-for list=\"{{ pkgSteps }}\" as=\"st\" hint-placeholder-count=\"6\">\n              <div onclick=\"{{ st.go }}\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;flex:none\">\n                <div style=\"width:26px;height:26px;border-radius:50%;background:{{ st.circleBg }};color:{{ st.circleColor }};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px\">{{ st.n }}<\u002Fdiv>\n                <span style=\"font-size:13px;font-weight:600;color:{{ st.labelColor }}\">{{ st.label }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:14px;height:2px;background:#EEF2F8\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- step body -->\n        <div style=\"flex:1;overflow-y:auto\">\n          <div style=\"max-width:820px;margin:0 auto;padding:32px\">\n\n            <!-- STEP 0 — IMPORT -->\n            <sc-if value=\"{{ pkgStepIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Start your package<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 24px\">Import to pre-fill the fields investors need, or start from scratch. You'll only be asked for what buyers actually require.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n                <div onclick=\"{{ importMLS }}\" style=\"background:#fff;border:1.5px solid #E4E9F1;border-radius:16px;padding:26px;cursor:pointer\" style-hover=\"border-color:#1366D6;box-shadow:0 6px 20px rgba(19,102,214,.1)\">\n                  <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;display:flex;align-items:center;justify-content:center;margin-bottom:14px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 5h16v14H4zM4 9h16M9 9v10\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                  <h3 style=\"font-family:'Poppins';font-weight:600;font-size:17px;margin:0 0 6px\">Import from MLS<\u002Fh3>\n                  <p style=\"color:#51607A;font-size:13.5px;line-height:1.5;margin:0\">Pull address, beds/baths, sqft, photos, and price from the active MLS listing.<\u002Fp>\n                <\u002Fdiv>\n                <div onclick=\"{{ importListing }}\" style=\"background:#fff;border:1.5px solid #E4E9F1;border-radius:16px;padding:26px;cursor:pointer\" style-hover=\"border-color:#1366D6;box-shadow:0 6px 20px rgba(19,102,214,.1)\">\n                  <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;display:flex;align-items:center;justify-content:center;margin-bottom:14px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M8 4h8l4 4v12H4V4z\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M8 13h8M8 17h5\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                  <h3 style=\"font-family:'Poppins';font-weight:600;font-size:17px;margin:0 0 6px\">Import existing listing<\u002Fh3>\n                  <p style=\"color:#51607A;font-size:13.5px;line-height:1.5;margin:0\">Paste a listing URL or upload the sheet, and we'll map the fields for you.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div onclick=\"{{ startManual }}\" style=\"background:#fff;border:1.5px dashed #b9c6dc;border-radius:14px;padding:18px 22px;cursor:pointer;display:flex;align-items:center;gap:12px\" style-hover=\"border-color:#1366D6\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M14 6l4 4M3 21l1-4L16 5l3 3L7 20z\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <div><div style=\"font-weight:600;font-size:15px\">Enter manually<\u002Fdiv><div style=\"color:#51607A;font-size:13px\">Fill in the fields yourself. It only takes a few minutes.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STEP 1 — PROPERTY -->\n            <sc-if value=\"{{ pkgStepIs1 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Property basics<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 24px\">The essentials buyers screen on first.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n                <div style=\"margin-bottom:16px\"><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Property address<\u002Flabel><input value=\"{{ pkgDraft.address }}\" disabled=\"\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#F5F8FC;color:#51607A\"><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px\">\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Type<\u002Flabel>\n                    <select value=\"{{ pkgDraft.type }}\" onchange=\"{{ setPkgType }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option>Single Family<\u002Foption><option>Condo<\u002Foption><option>Townhouse<\u002Foption><option>Multi-Family<\u002Foption><option>Manufactured<\u002Foption><\u002Fselect>\n                  <\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Beds<\u002Flabel><input value=\"{{ pkgDraft.beds }}\" oninput=\"{{ setPkgBeds }}\" placeholder=\"3\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Baths<\u002Flabel><input value=\"{{ pkgDraft.baths }}\" oninput=\"{{ setPkgBaths }}\" placeholder=\"2\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Square feet<\u002Flabel><input value=\"{{ pkgDraft.sqft }}\" oninput=\"{{ setPkgSqft }}\" placeholder=\"1560\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Year built<\u002Flabel><input value=\"{{ pkgDraft.year }}\" oninput=\"{{ setPkgYear }}\" placeholder=\"1968\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Asking / target price<\u002Flabel><input value=\"{{ pkgDraft.ask }}\" oninput=\"{{ setPkgAsk }}\" placeholder=\"385000\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Seller timeline<\u002Flabel>\n                  <select value=\"{{ pkgDraft.timeline }}\" onchange=\"{{ setPkgTimeline }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option value=\"\">Select…<\u002Foption><option>ASAP<\u002Foption><option>30 days<\u002Foption><option>45 days<\u002Foption><option>60 days<\u002Foption><option>Flexible<\u002Foption><\u002Fselect>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STEP 2 — PHOTOS & DOCS -->\n            <sc-if value=\"{{ pkgStepIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Photos &amp; documents<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">A minimum of 5 photos is required. Documents are optional but speed up investor diligence.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px;margin-bottom:16px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n                  <div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Photos<\u002Fdiv>\n                  <span style=\"font-size:12.5px;font-weight:600;color:{{ photosBadgeColor }}\">{{ photoCountLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n                  <sc-for list=\"{{ photoTiles }}\" as=\"p\" hint-placeholder-count=\"5\">\n                    <div style=\"aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#dfe7f3,#dfe7f3 9px,#e9eef7 9px,#e9eef7 18px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px;color:#8593ab\">\n                      <sc-if value=\"{{ p.hasUrl }}\" hint-placeholder-val=\"{{ false }}\">{{ p.imgEl }}<\u002Fsc-if>\n                      <sc-if value=\"{{ p.noUrl }}\" hint-placeholder-val=\"{{ true }}\"><span>photo {{ p.n }}<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <label style=\"aspect-ratio:4/3;border-radius:10px;border:2px dashed #b9c6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#1366D6\" style-hover=\"background:#F1F6FE;border-color:#1366D6\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#1366D6\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:600\">Upload<\u002Fspan><input type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onPkgPhotoFiles }}\" style=\"display:none\"><\u002Flabel>\n                <\u002Fdiv>\n                \n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n                <div style=\"font-family:'Poppins';font-weight:600;font-size:15px;margin-bottom:14px\">Documents<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ docTiles }}\" as=\"d\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;align-items:center;gap:10px;background:#F5F8FC;border-radius:10px;padding:11px 14px;font-size:13.5px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M8 4h8l4 4v12H4V4z\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>{{ d.name }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div onclick=\"{{ addDoc }}\" style=\"margin-top:12px;font-size:13px;font-weight:600;color:#1366D6;cursor:pointer\">+ Upload document (disclosure, title, agreement)<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STEP 3 — CONDITION -->\n            <sc-if value=\"{{ pkgStepIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Condition &amp; repairs<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Investors price off condition. Be specific, since this is what replaces a walkthrough.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px\">\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Overall condition<\u002Flabel>\n                    <select value=\"{{ pkgDraft.condition }}\" onchange=\"{{ setPkgCondition }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option>Turnkey<\u002Foption><option>Cosmetic<\u002Foption><option>Moderate<\u002Foption><option>Heavy<\u002Foption><\u002Fselect>\n                  <\u002Fdiv>\n                  <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Estimated rehab <span style=\"color:#8593ab;font-weight:500\">· recommended<\u002Fspan><\u002Flabel><input value=\"{{ pkgDraft.rehab }}\" oninput=\"{{ setPkgRehab }}\" placeholder=\"62000\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Condition notes <span style=\"color:#E1574C\">· required<\u002Fspan><\u002Flabel><textarea value=\"{{ pkgDraft.conditionNotes }}\" oninput=\"{{ setPkgCondNotes }}\" placeholder=\"Roof, HVAC, foundation, systems, known issues, recent updates…\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;min-height:120px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STEP 4 — AI DRAFTS -->\n            <sc-if value=\"{{ pkgStepIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n                <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0\">Summary and Repair Estimate<\u002Fh2>\n                <button onclick=\"{{ genAll }}\" style=\"display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:9px;border:none;background:linear-gradient(135deg,#1f74e6,#0E4DA6);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>Generate all with AI<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">AI drafts each section from your inputs. You review and edit before publishing, so nothing goes out unchecked.<\u002Fp>\n\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px;margin-bottom:14px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Property summary<\u002Fdiv><button onclick=\"{{ genSummary }}\" style=\"font-size:12.5px;font-weight:700;color:#1366D6;background:#EAF1FC;border:none;border-radius:8px;padding:6px 12px;cursor:pointer\">✨ Draft with AI<\u002Fbutton><\u002Fdiv>\n                <textarea value=\"{{ pkgDraft.propertySummary }}\" oninput=\"{{ setPkgSummary }}\" placeholder=\"Click 'Draft with AI' or write your own…\" style=\"width:100%;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14px;min-height:74px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px;margin-bottom:14px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Repair highlights<\u002Fdiv><button onclick=\"{{ genRepairs }}\" style=\"font-size:12.5px;font-weight:700;color:#1366D6;background:#EAF1FC;border:none;border-radius:8px;padding:6px 12px;cursor:pointer\">✨ Draft with AI<\u002Fbutton><\u002Fdiv>\n                <textarea value=\"{{ pkgDraft.repairHighlights }}\" oninput=\"{{ setPkgRepairs }}\" placeholder=\"Key repair line items…\" style=\"width:100%;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14px;min-height:60px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px;margin-bottom:14px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\"><div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Investor summary<\u002Fdiv><button onclick=\"{{ genInvSummary }}\" style=\"font-size:12.5px;font-weight:700;color:#1366D6;background:#EAF1FC;border:none;border-radius:8px;padding:6px 12px;cursor:pointer\">✨ Draft with AI<\u002Fbutton><\u002Fdiv>\n                <textarea value=\"{{ pkgDraft.investorSummary }}\" oninput=\"{{ setPkgInvSummary }}\" placeholder=\"ARV support, spread, margin…\" style=\"width:100%;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14px;min-height:60px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\"><div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Suggested tags<\u002Fdiv><button onclick=\"{{ genTags }}\" style=\"font-size:12.5px;font-weight:700;color:#1366D6;background:#EAF1FC;border:none;border-radius:8px;padding:6px 12px;cursor:pointer\">✨ Suggest<\u002Fbutton><\u002Fdiv>\n                  <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ pkgTags }}\" as=\"tag\" hint-placeholder-count=\"4\"><span style=\"font-size:12.5px;font-weight:600;background:#F1F6FE;color:#1366D6;padding:5px 12px;border-radius:20px\">{{ tag }}<\u002Fspan><\u002Fsc-for>\n                    <sc-if value=\"{{ pkgTagsEmpty }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;color:#8593ab\">No tags yet.<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\"><div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Comparable sales <span style=\"color:#E1574C;font-weight:500;font-size:12px\">· required<\u002Fspan><\u002Fdiv><button onclick=\"{{ genComps }}\" style=\"font-size:12.5px;font-weight:700;color:#1366D6;background:#EAF1FC;border:none;border-radius:8px;padding:6px 12px;cursor:pointer\">✨ Pull comps<\u002Fbutton><\u002Fdiv>\n                  <sc-for list=\"{{ pkgCompsRows }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid #EEF2F8;font-size:13px\"><span style=\"color:#51607A\">{{ c.addr }} · {{ c.dist }}<\u002Fspan><span style=\"font-weight:700\">{{ c.priceLabel }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ pkgCompsEmpty }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;color:#8593ab\">No comps yet. Pull 3+ to publish.<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STEP 5 — REVIEW -->\n            <sc-if value=\"{{ pkgStepIs5 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Review &amp; publish<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Once you publish, this listing is matched with buyers, scored against every investor's buy box and routed automatically, then sent to the national buyer program.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px;margin-bottom:16px;display:flex;align-items:center;gap:20px\">\n                <div style=\"width:76px;height:76px;border-radius:50%;border:6px solid {{ qualityColor }};display:flex;align-items:center;justify-content:center;flex:none\"><span style=\"font-family:'Poppins';font-weight:800;font-size:22px;color:{{ qualityColor }}\">{{ quality }}<\u002Fspan><\u002Fdiv>\n                <div><div style=\"font-family:'Poppins';font-weight:700;font-size:18px\">Package Quality Score<\u002Fdiv><div style=\"color:#51607A;font-size:14px\">{{ qualityLabel }}. The higher the score, the more competitive offers you'll receive.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px;margin-bottom:16px\">\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:14px\">\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Address<\u002Fspan><span style=\"font-weight:600\">{{ pkgDraft.address }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Asking<\u002Fspan><span style=\"font-weight:600\">{{ pkgAskLabel }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Photos<\u002Fspan><span style=\"font-weight:600\">{{ pkgDraft.photos }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Comps<\u002Fspan><span style=\"font-weight:600\">{{ pkgCompsCount }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Timeline<\u002Fspan><span style=\"font-weight:600\">{{ pkgTimelineLabel }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Condition<\u002Fspan><span style=\"font-weight:600\">{{ pkgDraft.condition }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- iBuyer integration -->\n              <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n                <div style=\"display:flex;align-items:flex-start;gap:12px;margin-bottom:6px\">\n                  <div style=\"width:38px;height:38px;border-radius:11px;background:#EAF1FC;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 11.2 12 5l8 6.2V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                  <div>\n                    <h3 style=\"font-family:'Poppins';font-weight:700;font-size:16.5px;margin:0 0 3px\">Also request iBuyer offers<\u002Fh3>\n                    <p style=\"color:#51607A;font-size:13.5px;line-height:1.5;margin:0\">Submit these same property details to Clever's iBuyer partners via their agent APIs. Their offers return here, alongside investor offers, with no separate partner portals.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:16px\">\n                  <sc-for list=\"{{ ibuyerOpts }}\" as=\"ib\" hint-placeholder-count=\"3\">\n                    <div onclick=\"{{ ib.toggle }}\" style=\"display:flex;align-items:center;gap:13px;padding:13px 16px;border:1.5px solid {{ ib.border }};background:{{ ib.bg }};border-radius:12px;cursor:pointer\">\n                      <div style=\"width:22px;height:22px;border-radius:6px;border:2px solid {{ ib.boxBorder }};background:{{ ib.boxBg }};display:flex;align-items:center;justify-content:center;flex:none\">\n                        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"opacity:{{ ib.checkOpacity }}\"><path d=\"M5 12l5 5L20 6\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fdiv>\n                      <div style=\"flex:1\"><div style=\"font-weight:600;font-size:15px\">{{ ib.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#8593ab\">{{ ib.desc }}<\u002Fdiv><\u002Fdiv>\n                      <span style=\"font-size:11px;font-weight:700;color:#8593ab;background:#F5F8FC;padding:3px 9px;border-radius:20px\">Agent API<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;font-size:12.5px;color:#8593ab\">{{ ibuyerSummary }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- footer nav -->\n        <div style=\"background:#fff;border-top:1px solid #E4E9F1;flex:none\">\n          <div style=\"max-width:820px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:12px\">\n            <button onclick=\"{{ closePkgEditor }}\" style=\"padding:12px 20px;border-radius:10px;border:1.5px solid #E4E9F1;background:#fff;color:#51607A;font-weight:600;font-size:14px;cursor:pointer\">Save &amp; exit<\u002Fbutton>\n            <div style=\"margin-left:auto;display:flex;gap:12px\">\n              <sc-if value=\"{{ pkgShowBack }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ pkgBack }}\" style=\"padding:12px 22px;border-radius:10px;border:1.5px solid #E4E9F1;background:#fff;color:#16223D;font-weight:600;font-size:14px;cursor:pointer\">Back<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pkgShowNext }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ pkgNext }}\" style=\"padding:12px 26px;border-radius:10px;border:none;background:#1366D6;color:#fff;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#0E4DA6\">{{ pkgNextLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pkgIsLast }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ publishPackage }}\" style=\"padding:12px 26px;border-radius:10px;border:none;background:#00B67A;color:#fff;font-weig color:#C9781A;background:#FFF7E9;padding:3px 10px;border-radius:20px\">Offers incoming<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"color:#51607A;font-size:13.5px;margin:0 0 16px\">Clever also requested offers from national buyers on your behalf. These arrive automatically, with no action needed.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px\">\n            <sc-for list=\"{{ sellerNbRows }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"border:1px solid #E4E9F1;border-radius:14px;padding:18px 20px;background:#FAFCFF\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'Poppins';font-weight:700;font-size:15.5px\">{{ n.buyer }}<\u002Fspan><span style=\"font-size:10px;font-weight:700;background:#EAF1FC;color:#0E4DA6;padding:2px 8px;border-radius:20px\">{{ n.badge }}<\u002Fspan><\u002Fdiv>\n                  <sc-if value=\"{{ n.pending }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:18px;height:18px;border:2.5px solid #F4D9A8;border-top-color:#F4A23B;border-radius:50%;animation:co-spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ n.received }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'Poppins';font-weight:800;font-size:24px;color:#16223D;margin-bottom:6px\">{{ n.offerLabel }}<\u002Fdiv><\u002Fsc-if>\n                <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ n.statusColor }};background:{{ n.statusBg }};padding:5px 11px;border-radius:20px;width:fit-content\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ n.dotColor }};display:inline-block\"><\u002Fspan>{{ n.statusLabel }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8593ab;margin-top:8px\">{{ n.close }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#a4afc2;line-height:1.5;margin-top:14px\">National buyer offers are estimates based on automated valuation. Final offers subject to property review. Sarah will walk you through how they compare.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:24px\">\n          <h2 style=\"font-family:'Poppins';font-weight:700;font-size:19px;margin:0 0 6px\">Next steps<\u002Fh2>\n          <sc-for list=\"{{ nextStepRows }}\" as=\"ns\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #EEF2F8\">\n              <div style=\"width:22px;height:22px;border-radius:50%;background:{{ ns.bg }};display:flex;align-items:center;justify-content:center;flex:none\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"{{ ns.check }}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <span style=\"font-size:14.5px;font-weight:500;color:{{ ns.textColor }}\">{{ ns.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- MESSAGES / CHAT -->\n      <sc-if value=\"{{ sellerChatActive }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;height:calc(100vh - 64px)\">\n        <div style=\"padding:18px 32px;border-bottom:1px solid #E4E9F1;background:#fff;display:flex;align-items:center;gap:13px\">\n          <div style=\"width:42px;height:42px;border-radius:50%;background:#1f74e6;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:15px;color:#fff\">SC<\u002Fdiv>\n          <div style=\"flex:1\"><div style=\"font-family:'Poppins';font-weight:600;font-size:16.5px\">Sarah Chen<\u002Fdiv><div style=\"font-size:12.5px;color:#00B67A;font-weight:600;display:flex;align-items:center;gap:5px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#00B67A;display:inline-block\"><\u002Fspan>Your Clever agent · usually replies in minutes<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;font-size:12.5px;color:#8593ab\"><span>(512) 555-0143<\u002Fspan><span style=\"color:#1366D6\">sarah.chen@cleveroffers.com<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;padding:26px 32px;background:#F5F8FC\">\n          <div style=\"max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"text-align:center;font-size:12px;color:#a4afc2;margin-bottom:4px\">Today<\u002Fdiv>\n            <sc-for list=\"{{ chatMsgs }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;justify-content:{{ m.rowJustify }}\">\n                <div style=\"max-width:74%;background:{{ m.bubbleBg }};color:{{ m.bubbleColor }};border:1px solid {{ m.bubbleBorder }};border-radius:16px;padding:12px 16px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 3px rgba(16,34,61,.05)\">\n                  {{ m.text }}\n                  <div style=\"font-size:10.5px;opacity:.6;margin-top:5px\">{{ m.time }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 32px;border-top:1px solid #E4E9F1;background:#fff\">\n          <div style=\"max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center\">\n            <input value=\"{{ chatInput }}\" oninput=\"{{ onChatInput }}\" onkeydown=\"{{ onChatKey }}\" placeholder=\"Message your agent…\" style=\"flex:1;border:1.5px solid #E4E9F1;border-radius:24px;padding:13px 18px;font-size:14.5px\" style-focus=\"border-color:#1366D6\">\n            <button onclick=\"{{ sendChat }}\" style=\"width:46px;height:46px;flex:none;border-radius:50%;border:none;background:#1366D6;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#0E4DA6\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12l16-8-6 16-3-6-7-2z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LISTINGS MARKETPLACE (filled in next) ============ -->\n  <sc-if value=\"{{ isListings }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1240px;margin:0 auto;padding:34px 28px 70px\">\n    <div style=\"margin-bottom:6px\"><span style=\"font-size:13px;font-weight:600;color:#1366D6;letter-spacing:.4px\">MARKETPLACE<\u002Fspan><\u002Fdiv>\n    <h1 style=\"font-family:'Poppins';font-weight:700;font-size:32px;margin:0 0 6px;letter-spacing:-.5px\">Clever Listing Marketplace<\u002Fh1>\n    <p style=\"color:#51607A;font-size:15.5px;margin:0 0 24px\">{{ listingCount }} active listing packages across the Clever Offers network, matched to your buy box and open to browse below.<\u002Fp>\n\n    <h2 style=\"font-family:'Poppins';font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:-.4px\">Browse live listings<\u002Fh2>\n    <p style=\"color:#51607A;font-size:14.5px;margin:0 0 22px\">Sort and filter the full database of active packages.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:268px 1fr;gap:28px;align-items:start\">\n      <!-- filters -->\n      <aside style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px;position:sticky;top:90px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n          <div style=\"font-family:'Poppins';font-weight:600;font-size:16px\">Filters<\u002Fdiv>\n          <span onclick=\"{{ resetFilters }}\" style=\"font-size:13px;color:#1366D6;font-weight:600;cursor:pointer\">Reset<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Zip code<\u002Flabel>\n          <input value=\"{{ lfZip }}\" oninput=\"{{ onLfZip }}\" placeholder=\"Any\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:10px 12px;font-size:14px\" style-focus=\"border-color:#1366D6\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <label style=\"font-size:12.5px;font-weight:600;color:#51607A;display:block;margin-bottom:8px\">Property type<\u002Flabel>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <sc-for list=\"{{ lfTypeOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ o.pick }}\" style=\"padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid {{ o.bdr }};background:{{ o.bg }};color:{{ o.col }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <label style=\"font-size:12.5px;font-weight:600;color:#51607A;display:block;margin-bottom:8px\">Min beds<\u002Flabel>\n          <div style=\"display:flex;gap:6px\">\n            <sc-for list=\"{{ lfBedOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ o.pick }}\" style=\"flex:1;padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid {{ o.bdr }};background:{{ o.bg }};color:{{ o.col }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <label style=\"font-size:12.5px;font-weight:600;color:#51607A;display:block;margin-bottom:8px\">Min baths<\u002Flabel>\n          <div style=\"display:flex;gap:6px\">\n            <sc-for list=\"{{ lfBathOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ o.pick }}\" style=\"flex:1;padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid {{ o.bdr }};background:{{ o.bg }};color:{{ o.col }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Max price<\u002Flabel>\n          <input value=\"{{ lfPriceMax }}\" oninput=\"{{ onLfPriceMax }}\" placeholder=\"No max\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:10px 12px;font-size:14px\" style-focus=\"border-color:#1366D6\">\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <!-- results -->\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n          <div style=\"color:#51607A;font-size:14.5px\"><b style=\"color:#16223D\">{{ listingResultCount }}<\u002Fb> homes<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"font-size:13.5px;color:#51607A\">Sort by<\u002Fspan>\n            <select value=\"{{ sortBy }}\" onchange=\"{{ onSort }}\" style=\"border:1.5px solid #E4E9F1;border-radius:9px;padding:9px 13px;font-size:14px;font-weight:600;color:#16223D;background:#fff;cursor:pointer\">\n              <option value=\"newest\">Newest first<\u002Foption>\n              <option value=\"oldest\">Oldest first<\u002Foption>\n              <option value=\"priceLow\">Price: low to high<\u002Foption>\n              <option value=\"priceHigh\">Price: high to low<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px\">\n          <sc-for list=\"{{ listingResults }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(16,34,61,.05)\">\n              <div style=\"height:158px;background:repeating-linear-gradient(135deg,#dfe7f3,#dfe7f3 11px,#e9eef7 11px,#e9eef7 22px);position:relative;display:flex;align-items:center;justify-content:center\">\n                {{ h.imgEl }}\n                <span style=\"position:absolute;top:12px;left:12px;background:#16223D;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px\">{{ h.arvPctLabel }}<\u002Fspan>\n                <span style=\"position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,.92);color:#51607A;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px\">{{ h.daysListed }}d listed<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n                  <div style=\"font-family:'Poppins';font-weight:700;font-size:22px;color:#1366D6\">{{ h.askLabel }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8593ab\">ARV {{ h.arvLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-weight:600;font-size:15px;margin:2px 0 2px\">{{ h.address }}<\u002Fdiv>\n                <div style=\"color:#51607A;font-size:13.5px;margin-bottom:12px\">{{ h.city }} {{ h.zip }}<\u002Fdiv>\n                <div style=\"display:flex;gap:14px;color:#51607A;font-size:13px;margin-bottom:16px\">\n                  <span><b style=\"color:#16223D\">{{ h.beds }}<\u002Fb> bd<\u002Fspan><span><b style=\"color:#16223D\">{{ h.baths }}<\u002Fb> ba<\u002Fspan><span><b style=\"color:#16223D\">{{ h.sqft }}<\u002Fb> sqft<\u002Fspan>\n                <\u002Fdiv>\n                <button onclic
