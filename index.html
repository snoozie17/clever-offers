  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d-template-columns: repeat(4\"]{grid-template-columns:repeat(2,1fr)!important}\n    [style*=\"grid-template-columns: repeat(3\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: repeat(2\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 1fr 1fr\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 1fr 340px\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 1fr 320px\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 2fr 1fr;\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 268px 1fr\"]{grid-template-columns:1fr!important}\n    [style*=\"minmax(300px\"]{grid-template-columns:1fr!important}\n    [style*=\"minmax(280px\"]{grid-template-columns:1fr!important}\n    [data-m=\"flow\"]{flex-direction:column!important}\n    [data-m=\"flow-arrow\"]{transform:rotate(90deg)}\n    [style*=\"height: 380px\"]{height:auto!important}\n    [style*=\"height: calc(100vh - 64px)\"]{height:calc(100vh - 132px)!important}\n    [data-m=\"stepper\"]{overflow-x:auto!important}\n    [data-m=\"stepper\"] span{display:none!important}\n    [data-m=\"stepper\"]>div{flex:none!important}\n    [style*=\"font-size: 48px\"]{font-size:30px!important}\n    [style*=\"font-size: 44px\"]{font-size:28px!important}\n    [style*=\"font-size: 38px\"]{font-size:27px!important}\n    [style*=\"font-size: 32px\"]{font-size:24px!important}\n    [style*=\"font-size: 30px\"]{font-size:23px!important}\n    [style*=\"padding: 34px 40px\"]{padding:22px 16px!important}\n    [style*=\"padding: 30px 40px\"]{padding:22px 16px!important}\n    [style*=\"padding: 78px 28px 96px\"]{padding:44px 18px 60px!important}\n    /* Agent Offers table → stacked rows */\n    [style*=\"grid-template-columns: 1.4fr 1.4fr 1fr 1.2fr 0.8fr\"]{grid-template-columns:1fr!important;gap:3px!important}\n    [data-m=\"offers-head\"]{display:none!important}\n    /* Agent Messages two-pane → stacked (list, then thread) */\n    [style*=\"grid-template-columns: 300px 1fr\"]{grid-template-columns:1fr!important;height:auto!important}\n    [style*=\"grid-template-columns: 300px 1fr\"]>div:first-child{max-height:240px!important;border-right:none!important;border-bottom:1px solid #EEF2F8!important}\n    [style*=\"grid-template-columns: 300px 1fr\"]>div:last-child{min-height:420px!important}\n    [style*=\"height: 560px\"]{height:auto!important}\n  }\n  @media (max-width:560px){\n    [style*=\"grid-template-columns: repeat(5\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: repeat(4\"]{grid-template-columns:repeat(2,1fr)!important}\n    [data-m=\"hero-search\"]{flex-direction:column!important}\n    [data-m=\"hero-search\"] button{width:100%!important;padding:16px 26px!important}\n    /* submission wizard footer → stacked, big tap targets */\n    [data-m=\"sub-footer\"]{flex-wrap:wrap!important;padding:12px 16px!important;gap:10px!important}\n    [data-m=\"sub-footer-actions\"]{width:100%!important;margin-left:0!important;order:-1;gap:10px!important}\n    [data-m=\"sub-footer-actions\"] button{flex:1 1 auto!important;padding:15px 16px!important}\n    [data-m=\"sub-quickmatch\"]{margin-left:0!important;padding:4px 0!important}\n  }\n  /* ===== mobile card optimizations (kept last so they win) ===== */\n  @media (max-width:820px){\n    /* horizontal image + info cards → stack image on top */\n    [data-m=\"imgcard\"]{flex-direction:column!important}\n    [data-m=\"imgcard-media\"]{width:100%!important;height:150px!important}\n    /* seller stage tracker → horizontal scroll instead of squish */\n    [data-m=\"stage\"]{overflow-x:auto!important;padding-bottom:8px;gap:4px}\n    [data-m=\"stage\"]>div{min-width:82px!important;flex:0 0 auto!important}\n    /* info-dense list rows → wrap, no overlap */\n    [data-m=\"listrow\"]{flex-wrap:wrap!important;align-items:flex-start!important;gap:10px 14px!important}\n    [data-m=\"listrow\"]>div[style weight:600;font-size:15px\">Submit offers in one click<\u002Fdiv><div style=\"color:#51607A;font-size:14px;line-height:1.5\">Compete privately. The seller only ever interfaces with their agent.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button onclick=\"{{ openApply }}\" style=\"margin-top:auto;background:#1366D6;color:#fff;border:none;padding:14px;border-radius:11px;font-weight:700;font-size:15.5px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Join the investor network<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- Agents -->\n        <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:20px;box-shadow:0 14px 40px rgba(16,34,61,.08);overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"background:linear-gradient(135deg,#23365e,#16223D);padding:30px 32px;color:#fff\">\n            <div style=\"font-size:13px;font-weight:600;letter-spacing:1.5px;opacity:.7;margin-bottom:8px\">FOR<\u002Fdiv>\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:26px;margin:0\">Agents<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"padding:30px 32px;flex:1;display:flex;flex-direction:column\">\n            <p style=\"color:#51607A;font-size:15.5px;line-height:1.6;margin:0 0 22px\">Turn your seller leads into competing offers. Build one listing package and let Clever shop it to hundreds of matched investors. You stay the seller's single point of contact.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:26px\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <div style=\"width:30px;height:30px;border-radius:8px;background:#EAF1FC;color:#1366D6;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700\">✓<\u002Fdiv>\n                <div><div style=\"font-weight:600;font-size:15px\">Qualified local leads<\u002Fdiv><div style=\"color:#51607A;font-size:14px;line-height:1.5\">Sellers in your zip codes who've asked for help, ready for outreach.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <div style=\"width:30px;height:30px;border-radius:8px;background:#EAF1FC;color:#1366D6;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700\">✓<\u002Fdiv>\n                <div><div style=\"font-weight:600;font-size:15px\">One package, many buyers<\u002Fdiv><div style=\"color:#51607A;font-size:14px;line-height:1.5\">Clever matches your package to investor buy boxes automatically.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <div style=\"width:30px;height:30px;border-radius:8px;background:#EAF1FC;color:#1366D6;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700\">✓<\u002Fdiv>\n                <div><div style=\"font-weight:600;font-size:15px\">Offers in one dashboard<\u002Fdiv><div style=\"color:#51607A;font-size:14px;line-height:1.5\">Track days listed, offers received, and buyer contacts in one place.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button onclick=\"{{ goSignIn }}\" style=\"margin-top:auto;background:#16223D;color:#fff;border:none;padding:14px;border-radius:11px;font-weight:700;font-size:15.5px;cursor:pointer\" style-hover=\"background:#23365e\">Sign in as an agent<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:34px;background:#fff;border:1px solid #E4E9F1;border-radius:20px;padding:42px 44px\">\n        <div style=\"text-align:center;max-width:680px;margin:0 auto 30px\">\n          <h2 style=\"font-family:'Poppins';font-weight:700;font-size:28px;margin:0 0 10px;letter-spacing:-.5px\">How buying with Clever works<\u002Fh2>\n          <p style=\"color:#51607A;font-size:16px;line-height:1.6;margin:0\">Set your criteria once and let the marketplace bring qualified deals to you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px\">\n          <div style=\"padding:6px\">\n            <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;color:#1366D6;font-family:'Poppins';font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px\">1<\u002Fdiv>\n            <h3 style=\"font-family:'Poppins';font-weight:600;font-size:16.5px;margin:0 0 7px\">Set your buy box<\u002Fh3>\n            <p style=\"color:#51607A;font-size:14px;line-height:1.55;margin:0\">Zip code, property type, price, ARV %, and rehab tolerance, set once.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:6px\">\n            <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;color:#1366D6;font-family:'Poppins';font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px\">2<\u002Fdiv>\n            <h3 style=\"font-family:'Poppins';font-weight:600;font-size:16.5px;margin:0 0 7px\">Get matched<\u002Fh3>\n            <p style=\"color:#51607A;font-size:14px;line-height:1.55;margin:0\">Every new listing package is scored against your criteria in seconds.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:6px\">\n            <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;color:#1366D6;font-family:'Poppins';font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px\">3<\u002Fdiv>\n            <h3 style=\"font-family:'Poppins';font-weight:600;font-size:16.5px;margin:0 0 7px\">Review the package<\u002Fh3>\n            <p style=\"color:#51607A;font-size:14px;line-height:1.55;margin:0\">Photos, condition notes, and comps, plus a summary and repair estimate.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:6px\">\n            <div style=\"width:44px;height:44px;border-radius:12px;background:#EAF1FC;color:#1366D6;font-family:'Poppins';font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px\">4<\u002Fdiv>\n            <h3 style=\"font-family:'Poppins';font-weight:600;font-size:16.5px;margin:0 0 7px\">Submit an offer<\u002Fh3>\n            <p style=\"color:#51607A;font-size:14px;line-height:1.55;margin:0\">One click to the listing agent. You compete privately, and the seller only ever talks to their agent.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:34px;background:#fff;border:1px solid #E4E9F1;border-radius:20px;padding:42px 44px\">\n        <div style=\"text-align:center;max-width:680px;margin:0 auto 30px\">\n          <h2 style=\"font-family:'Poppins';font-weight:700;font-size:28px;margin:0 0 10px;letter-spacing:-.5px\">Clever does the matching<\u002Fh2>\n          <p style=\"color:#51607A;font-size:16px;line-height:1.6;margin:0\">Every listing package is scored against thousands of active buy boxes the moment it goes live, so the right opportunity reaches the right buyer, instantly.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\">\n          <div style=\"text-align:center;padding:8px\"><div style=\"font-family:'Poppins';font-weight:800;font-size:34px;color:#1366D6\">2,400+<\u002Fdiv><div style=\"color:#51607A;font-size:14.5px;margin-top:4px\">Active investor buy boxes<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;padding:8px\"><div style=\"font-family:'Poppins';font-weight:800;font-size:34px;color:#1366D6\">&lt; 60s<\u002Fdiv><div style=\"color:#51607A;font-size:14.5px;margin-top:4px\">From package live to first match<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;padding:8px\"><div style=\"font-family:'Poppins';font-weight:800;font-size:34px;color:#1366D6\">3–5<\u002Fdiv><div style=\"color:#51607A;font-size:14.5px;margin-top:4px\">Competing offers per package<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ SIGN IN MODAL ============ -->\n  <sc-if value=\"{{ signInOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:300;background:rgba(16,34,61,.55);display:flex;align-items:center;justify-content:center;padding:24px\">\n    <div onclick=\"{{ closeSignIn }}\" style=\"position:absolute;inset:0\"><\u002Fdiv>\n    <div style=\"position:relative;width:100%;max-width:412px;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(8,40,90,.4);padding:34px 34px 26px\">\n      <span onclick=\"{{ closeSignIn }}\" style=\"position:absolute;top:16px;right:18px;cursor:pointer;color:#8593ab;font-size:20px;line-height:1\">✕<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;align-items:center;margin-bottom:22px\">\n        <img src=\"cadfe56a-fa3e-4c66-89f6-e25919783992\" alt=\"Clever Offers\" style=\"height:40px;width:auto;display:block;margin-bottom:14px\">\n        <h2 style=\"font-family:'Poppins';font-weight:700;font-size:21px;margin:0 0 4px\">Sign in to Clever Offers<\u002Fh2>\n        <p style=\"color:#8593ab;font-size:13.5px;margin:0\">Welcome back. Let's pick up where you left off.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:9px;margin-bottom:22px\">\n        <button onclick=\"{{ pickBuyer }}\" style=\"{{ roleBuyerStyle }}\">Investors<\u002Fbutton>\n        <button onclick=\"{{ pickAgent }}\" style=\"{{ roleAgentStyle }}\">Agents<\u002Fbutton>\n        <button onclick=\"{{ pickSeller }}\" style=\"{{ roleSellerStyle }}\">Sellers<\u002Fbutton>\n      <\u002Fdiv>\n\n      <label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Email address<\u002Flabel>\n      <input value=\"{{ siEmail }}\" oninput=\"{{ onSiEmail }}\" placeholder=\"you@email.com\" style=\"width:100%;margin:7px 0 16px;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px\" style-focus=\"border-color:#1366D6\">\n\n      <label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Password<\u002Flabel>\n      <input value=\"{{ siPassword }}\" oninput=\"{{ onSiPassword }}\" type=\"password\" placeholder=\"Enter your password\" style=\"width:100%;margin:7px 0 10px;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px\" style-focus=\"border-color:#1366D6\">\n      <button onclick=\"{{ logIn }}\" style=\"width:100%;padding:12px;border-radius:10px;border:none;background:#1366D6;color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;margin-bottom:14px\" style-hover=\"background:#0E4DA6\">Log In<\u002Fbutton>\n\n      <div style=\"display:flex;justify-content:center;gap:14px\">\n        <span style=\"font-size:12px;color:#a4afc2;cursor:pointer;text-decoration:underline\" style-hover=\"color:#51607A\">Forgot username?<\u002Fspan>\n        <span style=\"font-size:12px;color:#a4afc2;cursor:pointer;text-decoration:underline\" style-hover=\"color:#51607A\">Forgot password?<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ INVESTOR APPLICATION MODAL ============ -->\n  <sc-if value=\"{{ applyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:320;background:#F5F8FC;overflow-y:auto\">\n    <span onclick=\"{{ closeApply }}\" title=\"Close\" style=\"position:fixed;top:22px;right:26px;z-index:5;cursor:pointer;color:#8593ab;font-size:22px;line-height:1;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 2px 12px rgba(16,34,61,.12)\" style-hover=\"color:#16223D\">✕<\u002Fspan>\n    <div style=\"max-width:840px;margin:0 auto;padding:52px 24px 64px\">\n\n      <sc-if value=\"{{ applyShowForm }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"text-align:center;margin-bottom:30px\">\n          <div style=\"font-family:'Poppins';font-weight:800;font-size:13px;letter-spacing:1.6px;color:#1366D6;margin-bottom:12px\">APPLY<\u002Fdiv>\n          <h1 style=\"font-family:'Poppins';font-weight:800;font-size:44px;line-height:1.05;margin:0 0 14px;color:#16223D;letter-spacing:-1px\">Apply to the network<\u002Fh1>\n          <p style=\"color:#51607A;font-size:17px;line-height:1.55;margin:0 auto;max-width:540px\">If you look like a fit, our team will reach out to verify your credentials and schedule an interview.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(8,40,90,.1);border:1px solid #EAEFF6;padding:32px 36px\">\n\n        <sc-if value=\"{{ applyShowForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n            <span style=\"font-family:'Poppins';font-weight:800;font-size:11.5px;letter-spacing:.7px;color:#8593ab\">STEP {{ applyStepNum }} OF <span style=\"color:#1366D6\">5<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'Poppins';font-weight:800;font-size:11.5px;letter-spacing:.7px;color:#1366D6\">{{ applyStepTag }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:7px;border-radius:6px;background:#E8EEF5;overflow:hidden;margin-bottom:28px\"><div style=\"height:100%;width:{{ applyProgress }}%;background:#1366D6;border-radius:6px;transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n\n          <!-- STEP 1 -->\n          <sc-if value=\"{{ applyIs1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:27px;margin:0 0 7px;color:#16223D;letter-spacing:-.4px\">Let's start with you<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 24px\">Basic contact details so our team can reach out.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 20px\">\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">First name <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aFirst }}\" oninput=\"{{ onAFirst }}\" placeholder=\"Jane\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Last name <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aLast }}\" oninput=\"{{ onALast }}\" placeholder=\"Doe\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Phone number <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aPhone }}\" oninput=\"{{ onAPhone }}\" placeholder=\"(555) 123-4567\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Email address <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aEmail }}\" oninput=\"{{ onAEmail }}\" placeholder=\"you@company.com\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"color:#8593ab;font-size:13px;margin:16px 0 0\">By applying, you agree to be contacted by phone, text, or email about your application.<\u002Fp>\n          <\u002Fsc-if>\n\n          <!-- STEP 2 -->\n          <sc-if value=\"{{ applyIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:27px;margin:0 0 7px;color:#16223D;letter-spacing:-.4px\">Tell us about your company<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 24px\">A quick snapshot of your operation.<\u002Fp>\n            <div style=\"margin-bottom:18px\"><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Company name <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aCompany }}\" oninput=\"{{ onACompany }}\" placeholder=\"Acme Home Buyers, LLC\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px\">\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Year company was founded <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><input value=\"{{ aFounded }}\" oninput=\"{{ onAFounded }}\" placeholder=\"2018\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Homes purchased per year <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel><select value=\"{{ aVolume }}\" onchange=\"{{ onAVolume }}\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D;background:#fff;appearance:none;-webkit-appearance:none\"><option value=\"\">Select range<\u002Foption><option value=\"1–10\">1–10<\u002Foption><option value=\"11–25\">11–25<\u002Foption><option value=\"26–50\">26–50<\u002Foption><option value=\"51–100\">51–100<\u002Foption><option value=\"100+\">100+<\u002Foption><\u002Fselect><\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:3px\">What types of purchases do you do? <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel>\n            <p style=\"color:#8593ab;font-size:13px;margin:0 0 14px\">Select all that apply and enter percentages. Must total 100%.<\u002Fp>\n            <sc-for list=\"{{ applyPurchaseRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div style=\"{{ row.cardStyle }}\">\n                <div onclick=\"{{ row.toggle }}\" style=\"display:flex;align-items:center;gap:13px;cursor:pointer\">\n                  <div style=\"{{ row.boxStyle }}\"><sc-if value=\"{{ row.checked }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#fff\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fdiv>\n                  <span style=\"font-weight:700;font-size:15px;color:#16223D\">{{ row.label }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"{{ row.pctWrapStyle }}\"><input value=\"{{ row.pct }}\" oninput=\"{{ row.onPct }}\" placeholder=\"0\" style=\"width:44px;border:none;padding:11px 4px;font-size:15px;text-align:right;background:transparent;color:#16223D\"><span style=\"color:#8593ab;font-size:14px\">%<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;background:#F7F9FC;border:1.5px solid #EEF2F8;border-radius:11px;padding:14px 16px;margin-top:2px\">\n              <span style=\"font-weight:700;font-size:14px;color:#16223D\">Total of selected types<\u002Fspan>\n              <span style=\"font-family:'Poppins';font-weight:800;font-size:14px;color:{{ applyPtTotalColor }}\">{{ applyPtTotal }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 3 -->\n          <sc-if value=\"{{ applyIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:27px;margin:0 0 7px;color:#16223D;letter-spacing:-.4px\">What do you buy?<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 22px\">Tell us your buy box so we route the right deals to you.<\u002Fp>\n            <label style=\"display:block;font-size:13px;font-weight:700;color:#16223D\">Property types you purchase <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 24px\">\n              <sc-for list=\"{{ applyPropCards }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <div onclick=\"{{ c.toggle }}\" style=\"{{ c.cardStyle }}\">\n                  <div style=\"{{ c.boxStyle }}\"><sc-if value=\"{{ c.checked }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#fff\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fdiv>\n                  <span style=\"font-weight:700;font-size:14.5px;color:#16223D\">{{ c.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n              <div>\n                <label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Price range <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel>\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <input value=\"{{ aPriceMin }}\" oninput=\"{{ onAPriceMin }}\" placeholder=\"Min\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 13px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\">\n                  <span style=\"color:#8593ab;font-size:13px\">to<\u002Fspan>\n                  <input value=\"{{ aPriceMax }}\" oninput=\"{{ onAPriceMax }}\" placeholder=\"Max\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 13px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:7px\">Year built <span style=\"color:#e0564f\">*<\u002Fspan><\u002Flabel>\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <input value=\"{{ aYearOld }}\" oninput=\"{{ onAYearOld }}\" placeholder=\"Oldest\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 13px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\">\n                  <span style=\"color:#8593ab;font-size:13px\">to<\u002Fspan>\n                  <input value=\"{{ aYearNew }}\" oninput=\"{{ onAYearNew }}\" placeholder=\"Newest\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 13px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\">\n                <\u002Fdiv>\n                <p style=\"color:#8593ab;font-size:12.5px;margin:8px 0 0\">Enter the oldest and newest year built you'll consider.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 4 -->\n          <sc-if value=\"{{ applyIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:27px;margin:0 0 7px;color:#16223D;letter-spacing:-.4px\">Where do you buy?<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 22px\">Help us match you with deals in the right markets.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:24px\">\n              <sc-for list=\"{{ applyGeoCards }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div onclick=\"{{ g.pick }}\" style=\"{{ g.cardStyle }}\">\n                  <div style=\"{{ g.dotStyle }}\"><sc-if value=\"{{ g.dotInner }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:10px;height:10px;border-radius:50%;background:#1366D6\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                  <div><div style=\"font-weight:700;font-size:15.5px;color:#16223D;margin-bottom:3px\">{{ g.label }}<\u002Fdiv><div style=\"color:#51607A;font-size:13.5px\">{{ g.desc }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <label style=\"display:block;font-size:13px;font-weight:700;color:#16223D\">Details <span style=\"color:#8593ab;font-weight:600\">(optional)<\u002Fspan><\u002Flabel>\n            <textarea value=\"{{ aGeoDetails }}\" oninput=\"{{ onAGeoDetails }}\" placeholder=\"Any extra context about your geographic coverage…\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:11px;padding:13px 15px;font-size:15px;color:#16223D;min-height:96px;resize:vertical;margin-top:8px\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n            <p style=\"color:#8593ab;font-size:13px;margin:14px 0 0\">Note: when we call you for onboarding, we can get more granular.<\u002Fp>\n          <\u002Fsc-if>\n\n          <!-- STEP 5 — REVIEW -->\n          <sc-if value=\"{{ applyIs5 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:27px;margin:0 0 7px;color:#16223D;letter-spacing:-.4px\">Review your application<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 22px\">Make sure everything looks right before you submit.<\u002Fp>\n            <div style=\"border:1px solid #EEF2F8;border-radius:14px;overflow:hidden\">\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Name<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvName }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Contact<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvContact }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Company<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvCompany }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Founded<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvFounded }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Homes / year<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvVolume }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Purchase mix<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvPurchase }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Property types<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvPropTypes }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Price range<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvPrice }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;border-bottom:1px solid #F2F5FA;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Year built<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvYears }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 18px;font-size:14px\"><span style=\"color:#8593ab;font-weight:600;flex:none\">Markets<\u002Fspan><span style=\"color:#16223D;font-weight:600;text-align:right\">{{ rvGeo }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid #EEF2F8\">\n            <button onclick=\"{{ applyBack }}\" style=\"background:#fff;border:1.5px solid #DDE4EE;color:#16223D;padding:12px 26px;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"border-color:#1366D6;color:#1366D6\">Back<\u002Fbutton>\n            <button onclick=\"{{ applyNext }}\" style=\"{{ applyNextStyle }}\">{{ applyNextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ applyDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:30px 8px 14px\">\n            <div style=\"width:74px;height:74px;border-radius:50%;background:#E7F7F0;display:flex;align-items:center;justify-content:center;margin:0 auto 22px\"><svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#0a8f60\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <h2 style=\"font-family:'Poppins';font-weight:800;font-size:28px;margin:0 0 12px;color:#16223D;letter-spacing:-.4px\">Thanks for applying<\u002Fh2>\n            <p style=\"color:#51607A;font-size:16px;line-height:1.6;margin:0 auto 28px;max-width:440px\">A member of our concierge team will reach out to you to schedule an interview.<\u002Fp>\n            <button onclick=\"{{ closeApply }}\" style=\"background:#1366D6;color:#fff;border:none;padding:13px 34px;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Done<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ applyShowForm }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"text-align:center;margin-top:20px;font-size:13px;color:#8593ab\">Your information is kept confidential and is only used to evaluate your application.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ AGENT PORTAL (filled in next) ============ -->\n  <sc-if value=\"{{ isAgent }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;background:#F5F8FC\">\n    <!-- sticky top nav -->\n    <header style=\"position:sticky;top:0;z-index:50;backg ign out\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <!-- main -->\n    <div style=\"max-width:1240px;margin:0 auto;min-width:0;display:flex;flex-direction:column\">\n      <!-- DASHBOARD -->\n      <sc-if value=\"{{ agentDashActive }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:34px 40px 60px;width:100%\">\n        <div style=\"margin-bottom:8px\"><span style=\"font-size:13px;font-weight:600;color:#1366D6;letter-spacing:.4px\">AGENT PORTAL<\u002Fspan><\u002Fdiv>\n        <h1 style=\"font-family:'Poppins';font-weight:700;font-size:30px;margin:0 0 4px;letter-spacing:-.5px\">Good morning, Sarah<\u002Fh1>\n        <p style=\"color:#51607A;font-size:15.5px;margin:0 0 26px\">Your cash-offer partner workspace. Here's what needs you today.<\u002Fp>\n\n        <!-- stat row -->\n        <div data-m=\"statgrid\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px\">\n          <div onclick=\"{{ setAgentLeads }}\" style=\"background:#fff;border:1px solid #E4E9F1;border-radius:14px;padding:18px 20px;cursor:pointer\" style-hover=\"border-color:#1366D6\">\n            <div style=\"font-family:'Poppins';font-weight:800;font-size:28px;color:#16223D\">{{ newLeadsStat }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#51607A;margin-top:2px\">New leads<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ setAgentHomeowners }}\" style=\"background:#fff;border:1px solid #E4E9F1;border-radius:14px;padding:18px 20px;cursor:pointer\" style-hover=\"border-color:#1366D6\">\n            <div style=\"font-family:'Poppins';font-weight:800;font-size:28px;color:#16223D\">{{ statHomeowners }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#51607A;margin-top:2px\">Homeowners<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ setAgentSellers }}\" style=\"background:#fff;border:1px solid #E4E9F1;border-radius:14px;padding:18px 20p :{{ pk.statusBg }};color:{{ pk.statusColor }};font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px\">{{ pk.statusLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height:7px;border-radius:5px;background:#EEF2F8;overflow:hidden\">\n                      <div style=\"height:100%;width:{{ pk.quality }}%;background:{{ pk.barColor }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:none;text-align:right;width:74px\">\n                    <div style=\"font-family:'Poppins';font-weight:700;font-size:17px;color:#16223D\">{{ pk.quality }}<span style=\"font-size:12px;color:#8593ab\">/100<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:11px;color:#8593ab\">quality<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- tasks -->\n          <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:24px;position:sticky;top:88px\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:19px;margin:0 0 16px\">Tasks<\u002Fh2>\n            <sc-for list=\"{{ taskRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid #EEF2F8\">\n                <div onclick=\"{{ t.done }}\" title=\"Mark done\" style=\"width:20px;height:20px;border-radius:6px;border:2px solid {{ t.dotColor }};flex:none;margin-top:1px;cursor:pointer\" style-hover=\"background:#F1F6FE\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14px;font-weight:500;line-height:1.4\">{{ t.label }}<\u002Fdiv>\n                  <div style=\"font-size:12px;font-weight:600;color:{{ t.dueColor }};margin-top:3px\">{{ t.due }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n
