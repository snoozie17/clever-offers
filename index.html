px;border:1.5px solid #E4E9F1;background:#fff;color:#16223D;font-weight:600;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px\" style-hover=\"border-color:#E1574C;color:#E1574C\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"{{ deal.heartColor }}\"><path d=\"M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z\" stroke=\"{{ deal.heartStroke }}\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            {{ deal.saveLabel }}\n          <\u002Fbutton>\n          <div style=\"margin-top:16px;padding-top:16px;border-top:1px solid #EEF2F8;font-size:12px;color:#8593ab;line-height:1.5\">Offers are submitted privately. The seller only interfaces with their Clever agent.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ NEW SUBMISSION WIZARD (Mapbox + Rentcast + AI) — shared ============ -->\n  <sc-if value=\"{{ subOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:140;background:#F5F8FC;display:flex;flex-direction:column\">\n      <!-- header + stepper -->\n      <div style=\"background:#fff;border-bottom:1px solid #E4E9F1;flex:none\">\n        <div style=\"max-width:900px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:16px\">\n          <div style=\"flex:1\">\n            <div style=\"font-family:'Poppins';font-weight:700;font-size:19px\">{{ subTitle }}<\u002Fdiv>\n            <div style=\"color:#51607A;font-size:13.5px\">{{ subLede }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ subModeFull }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:none;text-align:right\">\n            <div style=\"display:flex;align-items:center;gap:8px;justify-content:flex-end\"><span style=\"font-size:12px;color:#8593ab\">Completeness<\u002Fspan><span style=\"font-family:'Poppins';font-weight:800;font-size:18px;color:{{ subQualityColor }}\">{{ subQuality }}/100<\u002Fspan><\u002Fdiv>\n            <div style=\"width:130px;height:6px;border-radius:5px;background:#EEF2F8;overflow:hidden;margin-top:4px\"><div style=\"height:100%;width:{{ subQuality }}%;background:{{ subQualityColor }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <span onclick=\"{{ closeSub }}\" style=\"cursor:pointer;color:#8593ab;font-size:22px;line-height:1;margin-left:8px\">✕<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ subModeFull }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-m=\"stepper\" style=\"max-width:900px;margin:0 auto;padding:0 32px 16px;display:flex;align-items:center;gap:6px\">\n          <sc-for list=\"{{ subSteps }}\" as=\"st\" hint-placeholder-count=\"6\">\n            <div onclick=\"{{ st.go }}\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;flex:none\">\n              <div style=\"width:26px;height:26px;border-radius:50%;background:{{ st.circleBg }};color:{{ st.circleColor }};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px\">{{ st.n }}<\u002Fdiv>\n              <span style=\"font-size:13px;font-weight:600;color:{{ st.labelColor }}\">{{ st.label }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:14px;height:2px;background:#EEF2F8\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- body -->\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:720px;margin:0 auto;padding:32px\">\n\n          <!-- ===== FAST TRACK — match with an advisor using only a ZIP ===== -->\n          <sc-if value=\"{{ subModeQuick }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ quickFormShow }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"max-width:480px;margin:0 auto\">\n                <div style=\"display:inline-flex;align-items:center;gap:7px;background:#EAF1FC;color:#1366D6;font-weight:700;font-size:12px;letter-spacing:.4px;padding:5px 12px;border-radius:20px;margin-bottom:14px\">FAST TRACK<\u002Fdiv>\n                <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Just get matched with an advisor<\u002Fh2>\n                <p style=\"color:#51607A;font-size:15px;line-height:1.55;margin:0 0 22px\">Not ready to fill out every detail? Enter your zip code and contact details. A dedicated advisor will contact you and build your listing package with you.<\u002Fp>\n                <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n                  <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:6px\">Property zip code <span style=\"color: rgb(225, 87, 76);\">*<\u002Fspan><\u002Flabel><input value=\"{{ quickZip }}\" oninput=\"{{ onQuickZip }}\" inputmode=\"numeric\" placeholder=\"e.g. 20105\" style=\"width:100%;box-sizing:border-box;border:1.6px solid #E4E9F1;border-radius:10px;padding:13px 15px;font-size:16px;letter-spacing:3px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:6px\">Your name <span style=\"color:#E1574C\">*<\u002Fspan><\u002Flabel><input value=\"{{ quickName }}\" oninput=\"{{ onQuickName }}\" placeholder=\"Jane Doe\" style=\"width:100%;box-sizing:border-box;border:1.6px solid #E4E9F1;border-radius:10px;padding:13px 15px;font-size:15px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:6px\">Phone <span style=\"color:#E1574C\">*<\u002Fspan><\u002Flabel><input value=\"{{ quickPhone }}\" oninput=\"{{ onQuickPhone }}\" inputmode=\"tel\" placeholder=\"(555) 000-0000\" style=\"width:100%;box-sizing:border-box;border:1.6px solid #E4E9F1;border-radius:10px;padding:13px 15px;font-size:15px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"display:block;font-size:13px;font-weight:700;color:#16223D;margin-bottom:6px\">Email <span style=\"color:#E1574C\">*<\u002Fspan><\u002Flabel><input value=\"{{ quickEmail }}\" oninput=\"{{ onQuickEmail }}\" inputmode=\"email\" placeholder=\"you@email.com\" style=\"width:100%;box-sizing:border-box;border:1.6px solid #E4E9F1;border-radius:10px;padding:13px 15px;font-size:15px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <button onclick=\"{{ submitQuickMatch }}\" style=\"width:100%;padding:14px;border-radius:11px;border:none;background:#1366D6;color:#fff;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Match me with an advisor<\u002Fbutton>\n                  <div style=\"font-size:12px;color:#8593ab;text-align:center\">No listing agreement or obligation. Your advisor just helps you explore your options.<\u002Fdiv>\n                <\u002Fdiv>\n                <div onclick=\"{{ backToFull }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding:12px 16px;background:#fff;border:1.5px solid #cfe0f7;border-radius:11px;font-size:14px;font-weight:600;color:#1366D6;cursor:pointer\" style-hover=\"background:#EAF1FC;border-color:#1366D6\"><span style=\"font-size:16px\">←<\u002Fspan>Prefer to enter your home details now? <span style=\"text-decoration:underline\">Go back to the full listing<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ quickDone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:460px;margin:10px auto 0;text-align:center\">\n                <div style=\"width:60px;height:60px;border-radius:50%;background:#E7F7F0;display:flex;align-items:center;justify-content:center;margin:0 auto 18px\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#0a8f60\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <h2 style=\"font-family:'Poppins';font-weight:700;font-size:26px;margin:0 0 10px;letter-spacing:-.4px\">You're matched with an advisor<\u002Fh2>\n                <p style=\"color:#51607A;font-size:15px;line-height:1.55;margin:0 0 22px\">A Clever advisor serving {{ quickZip }} will reach out within one business day to learn about your home and build your listing package with you. Nothing else to finish now.<\u002Fp>\n                <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:20px;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:20px\">\n                  <div style=\"width:52px;height:52px;border-radius:50%;background:#1f74e6;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:17px;color:#fff;flex:none\">SC<\u002Fdiv>\n                  <div style=\"flex:1\"><div style=\"font-family:'Poppins';font-weight:600;font-size:17px\">Sarah Chen<\u002Fdiv><div style=\"color:#51607A;font-size:13px\">Clever Advisor · <span style=\"color:#C9781A;font-weight:600\">4.9 ★<\u002Fspan> · 212 homes sold<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <button onclick=\"{{ finishQuickMatch }}\" style=\"width:100%;padding:14px;border-radius:11px;border:none;background:#00B67A;color:#fff;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#0a9d69\">Go to my seller portal<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- STEP 0 — ADDRESS -->\n          <sc-if value=\"{{ subStepIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">What's the property address?<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 22px\">Start typing and select your address. We'll pull the property details automatically.<\u002Fp>\n            <div style=\"position:relative\">\n              <svg style=\"position:absolute;left:16px;top:17px\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z\" stroke=\"#8593ab\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.4\" stroke=\"#8593ab\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n              <input value=\"{{ geoQuery }}\" oninput=\"{{ onGeoInput }}\" onfocus=\"{{ geoFocus }}\" placeholder=\"e.g. 1204 Bluebonnet Ln\" autocomplete=\"off\" style=\"width:100%;border:1.6px solid #E4E9F1;border-radius:12px;padding:15px 16px 15px 44px;font-size:16px;background:#fff\" style-focus=\"border-color:#1366D6\">\n              <sc-if value=\"{{ geoShow }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:60px;left:0;right:0;background:#fff;border:1px solid #E4E9F1;border-radius:12px;box-shadow:0 16px 40px rgba(16,34,61,.16);overflow:hidden;z-index:5;animation:co-slidein .12s ease\">\n                  <sc-for list=\"{{ geoResults }}\" as=\"g\" hint-placeholder-count=\"3\">\n                    <div onclick=\"{{ g.pick }}\" style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-bottom:1px solid #F2F5FA\" style-hover=\"background:#F5F9FF\">\n                      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z\" stroke=\"#1366D6\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.2\" stroke=\"#1366D6\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n                      <div><div style=\"font-weight:600;font-size:14.5px\">{{ g.label }}<\u002Fdiv><div style=\"font-size:12.5px;color:#8593ab\">{{ g.sub }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:8px 16px;font-size:11px;color:#a4afc2;display:flex;align-items:center;gap:6px;background:#FAFCFF\">Powered by Mapbox · US addresses<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ addrExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:15px\">\n                <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">Address<\u002Flabel><input value=\"{{ subAddr1 }}\" oninput=\"{{ onSubAddr1 }}\" placeholder=\"Street address\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">Address Line 2<\u002Flabel><input value=\"{{ subUnit }}\" oninput=\"{{ onSubUnit }}\" placeholder=\"Apt / Suite / Bldg / Unit\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">City<\u002Flabel><input value=\"{{ subCity }}\" oninput=\"{{ onSubCity }}\" placeholder=\"City\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:15px\">\n                  <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">State<\u002Flabel><input value=\"{{ subState }}\" oninput=\"{{ onSubState }}\" placeholder=\"State\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                  <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">Postcode<\u002Flabel><input value=\"{{ subZipVal }}\" oninput=\"{{ onSubZip }}\" placeholder=\"Postcode\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div><label style=\"display:block;font-size:13px;font-weight:600;color:#16223D;margin-bottom:6px\">Country<\u002Flabel><input value=\"{{ subCountry }}\" oninput=\"{{ onSubCountry }}\" placeholder=\"Country\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Rentcast status -->\n            <sc-if value=\"{{ rentLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #E4E9F1;border-radius:14px;padding:18px 20px\">\n                <div style=\"width:22px;height:22px;border:2.5px solid #E4E9F1;border-top-color:#1366D6;border-radius:50%;animation:co-spin .8s linear infinite;flex:none\"><\u002Fdiv>\n                <div><div style=\"font-weight:600;font-size:14.5px\">Looking up property details…<\u002Fdiv><div style=\"font-size:12.5px;color:#8593ab\">Pulling beds, baths, sq ft, year built &amp; estimated value from property records.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rentDone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;background:#fff;border:1.5px solid #cfe8db;border-radius:14px;padding:18px 20px;animation:co-slidein .18s ease\">\n                <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n                  <span style=\"width:22px;height:22px;border-radius:50%;background:#E7F7F0;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#0a8f60\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                  <span style=\"font-weight:700;font-size:14.5px;color:#0a8f60\">Property details found<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;color:#8593ab;background:#F5F8FC;padding:3px 9px;border-radius:20px;margin-left:auto\">from property records<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:20px;flex-wrap:wrap;font-size:14px\">\n                  <span><b>{{ subDraft.beds }}<\u002Fb> bd<\u002Fspan><span><b>{{ subDraft.baths }}<\u002Fb> ba<\u002Fspan><span><b>{{ subDraft.sqft }}<\u002Fb> sqft<\u002Fspan><span>Built <b>{{ subDraft.year }}<\u002Fb><\u002Fspan><span>Est. value <b style=\"color:#1366D6\">{{ rentValueLabel }}<\u002Fb><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;font-size:12.5px;color:#8593ab\">All fields are pre-filled on the next step. Edit anything that's off.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rentNotFound }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;background:#FFF7E9;border:1.5px solid #F4D9A8;border-radius:14px;padding:18px 20px\">\n                <div style=\"font-weight:700;font-size:14px;color:#9A6411;margin-bottom:4px\">Property details not found<\u002Fdiv>\n                <div style=\"font-size:13px;color:#6b5328\">No records matched this address. Please fill in the details manually on the next step.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ showQuickCtaCard }}\" hint-placeholder-val=\"{{ false }}\">\n              <div onclick=\"{{ startQuickMatch }}\" style=\"margin-top:20px;display:flex;align-items:center;gap:12px;background:#F5F9FF;border:1px dashed #b9c6dc;border-radius:12px;padding:13px 16px;cursor:pointer\" style-hover=\"border-color:#1366D6;background:#EFF5FE\">\n                <div style=\"width:30px;height:30px;border-radius:8px;background:#EAF1FC;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 3 4 14h6l-1 7 9-11h-6z\" fill=\"#1366D6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <div style=\"flex:1;font-size:13.5px;color:#3a475f;line-height:1.4\"><b style=\"color: rgb(22, 34, 61);\">Don't want to fill all this out?<\u002Fb> Enter just your zip code and get matched with an advisor.<\u002Fdiv>\n                <span style=\"color:#1366D6;font-weight:700;font-size:18px;flex:none\">→<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- STEP 1 — PROPERTY -->\n          <sc-if value=\"{{ subStepIs1 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Property basics<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 18px\">Review your home's details and edit anything you'd like to change.<\u002Fp>\n            <sc-if value=\"{{ rentDone }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;background:#EAF1FC;border:1px solid #cfe0f7;border-radius:11px;padding:11px 15px;margin-bottom:16px;font-size:13px;color:#0E4DA6\">\n                <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 3 4 14h6l-1 7 9-11h-6z\" fill=\"#1366D6\"><\u002Fpath><\u002Fsvg>\n                Auto-filled from property records · estimated value {{ rentValueLabel }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n              <div style=\"margin-bottom:16px\"><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Property address<\u002Flabel><input value=\"{{ subDraft.address }}\" disabled=\"\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#F5F8FC;color:#51607A\"><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px\">\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Type<\u002Flabel>\n                  <select value=\"{{ subDraft.type }}\" onchange=\"{{ setSubType }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option>Single Family<\u002Foption><option>Condo<\u002Foption><option>Townhouse<\u002Foption><option>Multi-Family<\u002Foption><option>Manufactured<\u002Foption><\u002Fselect>\n                <\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Beds<\u002Flabel><input value=\"{{ subDraft.beds }}\" oninput=\"{{ setSubBeds }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Baths<\u002Flabel><input value=\"{{ subDraft.baths }}\" oninput=\"{{ setSubBaths }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Square feet<\u002Flabel><input value=\"{{ subDraft.sqft }}\" oninput=\"{{ setSubSqft }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Year built<\u002Flabel><input value=\"{{ subDraft.year }}\" oninput=\"{{ setSubYear }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n                <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Asking / target price<\u002Flabel><input value=\"{{ subDraft.ask }}\" oninput=\"{{ setSubAsk }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px\" style-focus=\"border-color:#1366D6\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Seller timeline<\u002Flabel>\n                <select value=\"{{ subDraft.timeline }}\" onchange=\"{{ setSubTimeline }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option value=\"\">Select…<\u002Foption><option>ASAP<\u002Foption><option>30 days<\u002Foption><option>45 days<\u002Foption><option>60 days<\u002Foption><option>Flexible<\u002Foption><\u002Fselect>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 2 — PHOTOS -->\n          <sc-if value=\"{{ subStepIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Add photos<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Clear photos help buyers understand your home and can strengthen the offers you receive. Five or more is ideal.<\u002Fp>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n                <div style=\"font-family:'Poppins';font-weight:600;font-size:15px\">Photos<\u002Fdiv>\n                <span style=\"font-size:12.5px;font-weight:600;color:{{ subPhotosBadgeColor }}\">{{ subPhotoCountLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n                <sc-for list=\"{{ subPhotoTiles }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#dfe7f3,#dfe7f3 9px,#e9eef7 9px,#e9eef7 18px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px;color:#8593ab\">\n                    <sc-if value=\"{{ p.hasUrl }}\" hint-placeholder-val=\"{{ false }}\">{{ p.imgEl }}<\u002Fsc-if>\n                    <sc-if value=\"{{ p.noUrl }}\" hint-placeholder-val=\"{{ true }}\"><span>photo {{ p.n }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <label style=\"aspect-ratio:4/3;border-radius:10px;border:2px dashed #b9c6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#1366D6\" style-hover=\"background:#F1F6FE;border-color:#1366D6\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#1366D6\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:600\">Upload<\u002Fspan><input type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onSubPhotoFiles }}\" style=\"display:none\"><\u002Flabel>\n              <\u002Fdiv>\n              \n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 3 — CONDITION -->\n          <sc-if value=\"{{ subStepIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Condition<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Buyers price off condition. A few honest sentences can replace a walkthrough.<\u002Fp>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:26px\">\n              <div style=\"max-width:260px;margin-bottom:16px\"><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Overall condition<\u002Flabel>\n                <select value=\"{{ subDraft.condition }}\" onchange=\"{{ setSubCondition }}\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;background:#fff\"><option>Turnkey<\u002Foption><option>Cosmetic<\u002Foption><option>Moderate<\u002Foption><option>Heavy<\u002Foption><\u002Fselect>\n              <\u002Fdiv>\n              <div><label style=\"font-size:12.5px;font-weight:600;color:#51607A\">Condition notes<\u002Flabel><textarea value=\"{{ subDraft.conditionNotes }}\" oninput=\"{{ setSubCondNotes }}\" placeholder=\"Roof, HVAC, foundation, recent updates, anything a buyer should know…\" style=\"width:100%;margin-top:6px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14.5px;min-height:120px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 4 — AI DRAFTS -->\n          <sc-if value=\"{{ subStepIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Summary and Repair Estimate<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Write these yourself, or use Draft with AI on each box to generate one from the details you entered. You review and edit, and nothing is submitted without your confirmation.<\u002Fp>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px;margin-bottom:14px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px\">\n                <div style=\"font-family:'Poppins';font-weight:600;font-size:14.5px\">Property Summary <span style=\"color:#8593ab;font-weight:500;font-size:12.5px\">· if AI drafted, please review<\u002Fspan><\u002Fdiv>\n                <button onclick=\"{{ draftSummary }}\" style=\"display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,#1f74e6,#0E4DA6);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;flex:none\" style-hover=\"filter:brightness(1.06)\">\n                  <sc-if value=\"{{ aiSummaryLoading }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:co-spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ aiSummaryIdle }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  Draft with AI\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <textarea value=\"{{ subDraft.summary }}\" oninput=\"{{ setSubSummary }}\" placeholder=\"Click 'Draft with AI', or write your own 2–3 sentences.\" style=\"width:100%;margin-top:8px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14px;min-height:80px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:22px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px\">\n                <div style=\"font-family:'Poppins';font-weight:600;font-size:14.5px\">Repair Estimate <span style=\"color:#8593ab;font-weight:500;font-size:12.5px\">· if AI drafted, please review<\u002Fspan><\u002Fdiv>\n                <button onclick=\"{{ draftRepair }}\" style=\"display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,#1f74e6,#0E4DA6);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;flex:none\" style-hover=\"filter:brightness(1.06)\">\n                  <sc-if value=\"{{ aiRepairLoading }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:co-spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ aiRepairIdle }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  Draft with AI\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <textarea value=\"{{ subDraft.repairEstimate }}\" oninput=\"{{ setSubRepair }}\" placeholder=\"Click 'Draft with AI&quot;, or write your own rough cost range and rationale.\" style=\"width:100%;margin-top:8px;border:1.5px solid #E4E9F1;border-radius:9px;padding:11px 13px;font-size:14px;min-height:70px;resize:vertical\" style-focus=\"border-color:#1366D6\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showQuickCtaSteps }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ startQuickMatch }}\" style=\"margin-top:20px;display:flex;align-items:center;gap:12px;background:#F5F9FF;border:1px dashed #b9c6dc;border-radius:12px;padding:13px 16px;cursor:pointer\" style-hover=\"border-color:#1366D6;background:#EFF5FE\">\n              <div style=\"width:30px;height:30px;border-radius:8px;background:#EAF1FC;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 3 4 14h6l-1 7 9-11h-6z\" fill=\"#1366D6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"flex:1;font-size:13.5px;color:#3a475f;line-height:1.4\"><b style=\"color: rgb(22, 34, 61);\">Don't want to fill all this out?<\u002Fb> Enter just your zip code and get matched with an advisor.<\u002Fdiv>\n              <span style=\"color:#1366D6;font-weight:700;font-size:18px;flex:none\">→<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STEP 5 — REVIEW -->\n          <sc-if value=\"{{ subStepIs5 }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family:'Poppins';font-weight:700;font-size:24px;margin:0 0 6px\">Review &amp; send to your advisor<\u002Fh2>\n            <p style=\"color:#51607A;font-size:15px;margin:0 0 20px\">Give everything a final look before you send it to your advisor.<\u002Fp>\n            <div style=\"background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:24px;margin-bottom:16px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:14px\">\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Address<\u002Fspan><span style=\"font-weight:600\">{{ subDraft.address }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Asking<\u002Fspan><span style=\"font-weight:600\">{{ subAskLabel }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Beds / baths<\u002Fspan><span style=\"font-weight:600\">{{ subDraft.beds }} / {{ subDraft.baths }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Photos<\u002Fspan><span style=\"font-weight:600\">{{ subDraft.photos }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Condition<\u002Fspan><span style=\"font-weight:600\">{{ subDraft.condition }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #EEF2F8;padding-bottom:10px\"><span style=\"color:#51607A\">Timeline<\u002Fspan><span style=\"font-weight:600\">{{ subDraft.timeline }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:linear-gradient(135deg,#16223D,#23365e);border-radius:16px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:16px\">\n              <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 3 4 14h6l-1 7 9-11h-6z\" fill=\"#5b9bf0\"><\u002Fpath><\u002Fsvg>\n              <div><div style=\"font-weight:700;font-size:15.5px;margin-bottom:2px\">What happens after you submit<\u002Fdiv><div style=\"font-size:13px;color:rgba(255,255,255,.75);line-height:1.5\">A dedicated advisor reviews your listing, contacts you for any missing details and next steps, then shops it to competing buyers (cash investors and our national buyer network) to find the right fit for you.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ subAccountPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;max-width:470px;margin:0 auto 22px\">\n              <div style=\"width:58px;height:58px;border-radius:50%;background:#E7F7F0;display:flex;align-items:center;justify-content:center;margin:0 auto 16px\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5L20 6\" stroke=\"#0a8f60\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-family:'Poppins';font-weight:800;font-size:12.5px;letter-spacing:1.4px;color:#1366D6;margin-bottom:8px\">ALMOST DONE<\u002Fdiv>\n              <h2 style=\"font-family:'Poppins';font-weight:700;font-size:26px;margin:0 0 10px;color:#16223D;letter-spacing:-.4px\">Create an account to list today<\u002Fh2>\n              <p style=\"color:#51607A;font-size:15px;line-height:1.55;margin:0\">Save your package and get connected with cash offers. Your property details are already filled in and ready to go live.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"max-width:420px;margin:0 auto;background:#fff;border:1px solid #E4E9F1;border-radius:16px;padding:24px\">\n              <label style=\"display:block;font-size:12.5px;font-weight:700;color:#16223D;margin-bottom:6px\">Full name<\u002Flabel>\n              <input value=\"{{ acctName }}\" oninput=\"{{ onAcctName }}\" placeholder=\"Jane Doe\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D;margin-bottom:14px\" style-focus=\"border-color:#1366D6\">\n              <label style=\"display:block;font-size:12.5px;font-weight:700;color:#16223D;margin-bottom:6px\">Email address<\u002Flabel>\n              <input value=\"{{ acctEmail }}\" oninput=\"{{ onAcctEmail }}\" placeholder=\"you@email.com\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D;margin-bottom:14px\" style-focus=\"border-color:#1366D6\">\n              <label style=\"display:block;font-size:12.5px;font-weight:700;color:#16223D;margin-bottom:6px\">Create password<\u002Flabel>\n              <input value=\"{{ acctPassword }}\" oninput=\"{{ onAcctPassword }}\" type=\"password\" placeholder=\"Create a password\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #E4E9F1;border-radius:10px;padding:12px 14px;font-size:15px;color:#16223D;margin-bottom:18px\" style-focus=\"border-color:#1366D6\">\n              <button onclick=\"{{ createAccountAndList }}\" style=\"width:100%;padding:14px;border-radius:11px;border:none;background:#00B67A;color:#fff;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#0a9d69\">Create account &amp; list my home<\u002Fbutton>\n              <div onclick=\"{{ acctBackToReview }}\" style=\"text-align:center;margin-top:14px;font-size:13px;color:#8593ab;cursor:pointer\" style-hover=\"color:#1366D6\">← Back to review<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- footer nav -->\n      <sc-if value=\"{{ subShowFooter }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border-top:1px solid #E4E9F1;flex:none\">\n        <div data-m=\"sub-footer\" style=\"max-width:720px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:12px\">\n          <button onclick=\"{{ closeSub }}\" style=\"padding:12px 20px;border-radius:10px;border:1.5px solid #E4E9F1;background:#fff;color:#51607A;font-weight:600;font-size:14px;cursor:pointer\">Cancel<\u002Fbutton>\n          <sc-if value=\"{{ showQuickCta }}\" hint-placeholder-val=\"{{ true }}\">\n            <div data-m=\"sub-quickmatch\" onclick=\"{{ startQuickMatch }}\" style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#1366D6;cursor:pointer\" style-hover=\"color:#0E4DA6\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 3 4 14h6l-1 7 9-11h-6z\" fill=\"#1366D6\"><\u002Fpath><\u002Fsvg>Just match me with an advisor<\u002Fdiv>\n          <\u002Fsc-if>\n          <div data-m=\"sub-footer-actions\" style=\"margin-left:auto;display:flex;gap:12px\">\n            <sc-if value=\"{{ subShowBack }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ subBack }}\" style=\"padding:12px 22px;border-radius:10px;border:1.5px solid #E4E9F1;background:#fff;color:#16223D;font-weight:600;font-size:14px;cursor:pointer\">Back<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ subShowNext }}\" hint-placeholder-val=\"{{ true }}\">\n              <button onclick=\"{{ subNext }}\" style=\"padding:12px 26px;border-radius:10px;border:none;background:#1366D6;color:#fff;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#0E4DA6\">{{ subNextLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ subStepIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n              <button onclick=\"{{ subNext }}\" style=\"padding:12px 26px;border-radius:10px;border:none;background:#1366D6;color:#fff;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#0E4DA6\">Continue<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ subStepIs5 }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ subReviewSubmit }}\" style=\"padding:12px 28px;border-radius:10px;border:none;background:#00B67A;color:#fff;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#0a9d69\">{{ subSubmitLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;background:#16223D;color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:0 14px 40px rgba(16,34,61,.32);animation:co-toast .2s ease\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<template id=\"__bundler_thumbnail\">\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">\n  <rect width=\"100\" height=\"100\" fill=\"#1366D6\"><\u002Frect>\n  <path d=\"M30 54 L50 36 L70 54 L70 70 L30 70 Z\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpath>\n  <rect x=\"45\" y=\"60\" width=\"10\" height=\"10\" fill=\"#F4A23B\"><\u002Frect>\n<\u002Fsvg>\n<\u002Ftemplate><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'home-selling',\n    aboutOpen: false,\n    sellZip: '',\n    heroQuery: '',\n    heroResults: [],\n    heroFocused: false,\n    toast: '',\n    // agent\n    agentTab: 'dashboard',\n    agentMsgDrafts: {},\n    agentThreads: {},\n    activeThreadId: null,\n    agentComposer: '',\n    leads: [],\n    sellers: [],\n    tasks: [],\n    selectedSellerId: null,\n    pkgEditorId: null,\n    pkgStep: 0,\n    viewOffersId: null,\n    renamingId: null,\n    renameVal: '',\n    // investor\n    invTab: 'dashboard',\n    homes: [],\n    savedIds: [],\n    searchZip: '',\n    buyBox: {\n      zip: '78704', type: 'Single Family', beds: '3', baths: '2',\n      sqftMin: '1200', priceMin: '200000', priceMax: '500000',\n      arvMax: '75', rehabMax: '75000', condition: 'Any'\n    },\n    buyBoxDraft: null,\n    invOffers: [],\n    editingOffer: false,\n    offerAmount: '',\n    dealId: null,\n    dealReturn: 'investor',\n    // listings\n    sortBy: 'newest',\n    lf: { type:'All', beds:'Any', baths:'Any', zip:'', priceMax:'' },\n    // sign-in modal\n    signInOpen: false,\n    // investor application modal\n    applyOpen: false,\n    applyStep: 1,\n    applyDone: false,\n    apply: null,\n    authRole: '',\n    siRole: '',\n    siEmail: '',\n    siPassword: '',\n    // seller portal\n    sellerTab: 'homes',\n    sellerHomes: [],\n    chat: [],\n    chatInput: '',\n    // ===== NEW: submission wizard (Mapbox + Rentcast + AI) =====\n    subOpen: false,\n    subRole: 'seller',        // 'seller' | 'agent'\n    subFromHome: false,       // opened from public homepage → ends with account prompt\n    subAccountPrompt: false,\n    // ===== Fast-track: match with an advisor using just a ZIP =====\n    subMode: 'full',          // 'full' (whole wizard) | 'quick' (ZIP-only advisor match)\n    quickZip: '', quickName: '', quickPhone: '', quickEmail: '', quickDone: false,\n    addrExpanded: false,\n    mobileNavOpen: false,\n    portalNavOpen: false,\n    acctName: '', acctEmail: '', acctPassword: '',\n    subStep: 0,               // 0 address · 1 property · 2 photos · 3 condition · 4 AI · 5 review\n    subDraft: null,\n    geoQuery: '',\n    geoResults: [],\n    geoFocused: false,\n    rentStatus: 'idle',       // idle | loading | done | notfound\n    aiStatus: 'idle',         // idle | loading | done\n    // ===== NEW: live marketplace feed + national buyers =====\n    liveFeed: [],             // recent submission events for agent dashboard\n    nb: {},                   // national buyer requests keyed by listing id → [{buyer,status,offer,close,badge,reqAt}]\n    newMatchIds: [],          // home ids added in this session (NEW badge in investor)\n    nowTick: 0,               // drives \"x ago\" relabel\n  };\n\n  componentDidMount() {\n    this.setState({\n      leads: this.seedLeads(), sellers: this.seedSellers(), homes: this.seedHomes(),\n      sellerHomes: this.seedSellerHomes(), chat: this.seedChat(), tasks: this.seedTasks(),\n      nb: this.seedNB(), liveFeed: this.seedFeed(),\n    });\n    // Load the real marketplace state from Supabase (overrides seeds when online).\n    this.loadFromSupabase();\n    // real-time: a new submission from the network arrives roughly every 15s\n    this._live = setInterval(()=>this.injectListing(true), 15000);\n    // relabel \"x ago\" every 20s\n    this._clock = setInterval(()=>this.setState(st=>({nowTick:st.nowTick+1})), 20000);\n  }\n  componentWillUnmount(){ clearInterval(this._live); clearInterval(this._clock); clearTimeout(this._t); clearTimeout(this._ct); (this._nbTimers||[]).forEach(clearTimeout); }\n\n  // ================= Supabase backend (real REST API) =================\n  sbCfg(){\n    return {\n      url: 'https://tnunjvfppjbnjamfneii.supabase.co',\n      key: 'sb_publishable_emNnqN-uVGHBQsJ7v3wdrg_BVy7N5qS',\n      aiFn: 'https://tnunjvfppjbnjamfneii.supabase.co/functions/v1/ai-draft',\n    };\n  }\n  async sb(path, opts={}){\n    const c=this.sbCfg();\n    const res = await fetch(c.url+'/rest/v1/'+path, {\n      ...opts,\n      headers: { apikey:c.key, Authorization:'Bearer '+c.key, 'Content-Type':'application/json', ...(opts.headers||{}) },\n    });\n    if(!res.ok) throw new Error('sb '+res.status+' '+path+' '+(await res.text()));\n    const txt = await res.text();\n    return txt ? JSON.parse(txt) : null;\n  }\n  sbWrite(path, opts){ this.sb(path, opts).catch(e=>console.warn('[supabase write]', e.message)); }\n\n  async loadFromSupabase(){\n    try {\n      // Listings — self-seed the baseline homes into the DB on first ever load.\n      let rows = await this.sb('listings?select=payload&order=created_at.asc');\n      if(!rows || rows.length===0){\n        const seed = this.seedHomes();\n        await this.sb('listings', { method:'POST', headers:{Prefer:'return=minimal'},\n          body: JSON.stringify(seed.map(h=>({ id:h.id, payload:h, source:'seed' }))) });\n        rows = seed.map(h=>({ payload:h }));\n      }\n      const homes = rows.map(r=>r.payload);\n      const [offers, saved, bb, nbRows] = await Promise.all([\n        this.sb('investor_offers?select=payload&order=created_at.asc'),\n        this.sb('saved?select=home_id'),\n        this.sb('buy_box?id=eq.1&select=payload'),\n        this.sb('national_buyer_requests?select=listing_id,payload'),\n      ]);\n      const nb = {}; (nbRows||[]).forEach(r=>{ nb[r.listing_id]=r.payload; });\n      this.setState(st=>({\n        homes,\n        invOffers: (offers||[]).map(o=>o.payload),\n        savedIds: (saved||[]).map(r=>r.home_id),\n        buyBox: (bb && bb[0] && bb[0].payload) ? bb[0].payload : st.buyBox,\n        nb: Object.keys(nb).length ? {...st.nb, ...nb} : st.nb,\n        sbOnline: true,\n      }));\n    } catch(e){\n      console.warn('[supabase] offline — using local seeds:', e.message);\n      this.setState({ sbOnline:false });\n    }\n  }\n  persistNB(listingId){\n    const payload = (this.state.nb||{})[listingId] || [];\n    this.sbWrite('national_buyer_requests?on_conflict=listing_id', {\n      method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },\n      body: JSON.stringify({ listing_id:listingId, payload, updated_at:new Date().toISOString() }),\n    });\n  }\n\n  // National buyer requests already resolved for Maria's live listing (1204 Bluebonnet · seller s1)\n  seedNB(){\n    return {\n      s1: [\n        { buyer:'Opendoor', status:'received', offer:379000, close:'14-day close', badge:'Instant Offer', note:'Automated valuation · cash', reqAt:0 },\n        { buyer:'Homeward', status:'received', offer:392000, close:'21-day close', badge:'Best Price',    note:'Buy-before-you-sell · cash', reqAt:0 },\n        { buyer:'Zoomcasa', status:'received', offer:369500, close:'10-day close', badge:'Fastest Close',  note:'Cash · fastest timeline', reqAt:0 },\n        { buyer:'Offerpad', status:'received', offer:375500, close:'flexible close', badge:'Free Local Move', note:'Cash · free local move', reqAt:0 },\n      ],\n    };\n  }\n  seedFeed(){\n    const now = Date.now();\n    return [\n      { id:'f1', address:'3390 E 12th St', city:'Austin, TX 78721', beds:2, baths:1, sqft:980, ask:245000, matchScore:88, offers:2, by:'Sarah Chen', at: now-1000*60*6, live:true },\n      { id:'f2', address:'615 Saxony Ln', city:'Austin, TX 78745', beds:4, baths:3, sqft:2240, ask:512000, matchScore:81, offers:1, by:'Marcus Reed', at: now-1000*60*22, live:true },\n    ];\n  }\n\n  seedSellerHomes(){\n    return [\n      { id:'sh1', address:'1204 Bluebonnet Ln', city:'Austin, TX 78704', status:'Sale in progress', agreement:'complete', photo:'home exterior', listed:'Listed 12 days ago', detail:'4 offers in · reviewing with Sarah', beds:3, baths:2, sqft:1560 },\n      { id:'sh2', address:'88 Larkspur Dr', city:'Austin, TX 78745', status:'With advisor', agreement:'not-started', photo:'home exterior', listed:'Submitted 3 days ago', detail:'Sarah is enriching your package & shopping it to buyers', beds:2, baths:2, sqft:1180 },\n      { id:'sh3', address:'4519 Sendero Hills', city:'Austin, TX 78727', status:'Closed', agreement:'complete', photo:'home exterior', listed:'Sold Apr 18, 2026', detail:'Closed at $462,000 · funds disbursed', beds:4, baths:3, sqft:2310 },\n    ];\n  }\n  seedChat(){\n    return [\n      { id:'c1', from:'agent', text:\"Hi Maria! I've lined up several investors interested in 1204 Bluebonnet Ln. I'll bring you the top offers to review this week.\", time:'Mon 9:14 AM' },\n      { id:'c2', from:'me', text:\"That's great news. What kind of numbers are we seeing?\", time:'Mon 9:20 AM' },\n      { id:'c3', from:'agent', text:\"The strongest right now is $389k, all cash, 30-day close. Two more are coming in. No obligation; we'll review them together.\", time:'Mon 9:22 AM' },\n      { id:'c4', from:'agent', text:\"Also wanted to confirm: are you still hoping to close before the end of the month?\", time:'Mon 9:23 AM' },\n    ];\n  }\n\n  // ---------- seed data ----------\n  seedLeads() {\n    return [\n      { id:'l1', name:'Maria Delgado', address:'1204 Bluebonnet Ln', city:'Austin, TX', zip:'78704', situation:'Inherited property', timeline:'ASAP', submitted:'2 days ago', status:'concierge' },\n      { id:'l2', name:'James Whitfield', address:'908 Wilson St', city:'Austin, TX', zip:'78704', situation:'Relocating for work', timeline:'30 days', submitted:'4 days ago', status:'contacted' },\n      { id:'l3', name:'The Nguyen Family', address:'4521 Menchaca Rd', city:'Austin, TX', zip:'78745', situation:'Downsizing', timeline:'60 days', submitted:'5 days ago', status:'concierge' },\n      { id:'l4', name:'Robert & Lisa Park', address:'77 Oltorf St', city:'Austin, TX', zip:'78704', situation:'Avoiding foreclosure', timeline:'ASAP', submitted:'1 week ago', status:'concierge' },\n      { id:'l5', name:'Devon Carter', address:'2210 Cedar Ave', city:'Austin, TX', zip:'78745', situation:'Difficult rental property', timeline:'45 days', submitted:'1 week ago', status:'contacted' },\n    ];\n  }\n  seedSellers() {\n    return [\n      { id:'s1', leadName:'Maria Delgado', name:'1204 Bluebonnet Ln', address:'1204 Bluebonnet Ln', city:'Austin, TX 78704',\n        daysListed:12, hasPackage:true, packageStatus:'published', quality:96, pendingDecision:true, agreement:'complete', timeline:'ASAP',\n        beds:3, baths:2, sqft:1560, type:'Single Family', year:1968, ask:385000, arv:520000, rehab:62000,\n        photo:'home exterior', phone:'(512) 555-0107', email:'maria.delgado@email.com',\n        offers:[\n          { id:'o1', company:'Lonestar Capital Group', contact:'Marcus Webb', email:'marcus@lonestarcap.com', phone:'(512) 555-0142', amount:372000, date:'May 2', terms:'Cash · 14-day close', close:'14 days', contingencies:'None (as-is)', source:'Investor' },\n          { id:'o2', company:'Hill Country Holdings', contact:'Dana Pruitt', email:'dana@hchold.com', phone:'(512) 555-0198', amount:381500, date:'May 3', terms:'Cash · 21-day close', close:'21 days', contingencies:'Inspection (7 days)', source:'Investor' },\n          { id:'o5', company:'Opendoor', contact:'Opendoor Acquisitions', email:'agents@opendoor.com', phone:'(512) 555-0400', amount:379000, da :2, sqft:1560, year:1968, type:'Single Family', value:520000 },\n    ];\n  }\n  hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }\n  geocode(q){\n    const raw=(q||'').trim();\n    const s=raw.toLowerCase();\n    if(s.length<3) return [];\n    // 1) real matches from the curated set (these carry known Rentcast data)\n    const hits = this.geoDB().filter(a=>(a.line+' '+a.zip).toLowerCase().includes(s)).slice(0,5);\n    // 2) Mapbox-style completions synthesized from whatever the user typed, so the\n    //    dropdown is never empty for a 3+ char query (address may not be in our set).\n    const syn = hits.length>=5 ? [] : this.synthSuggestions(raw).slice(0, 5-hits.length);\n    const all=[...hits, ...syn].slice(0,5);\n    return all.map((a,i)=>({ ...a, id:'g'+i, label:a.line, sub:a.city+' '+a.zip }));\n  }\n  synthSuggestions(raw){\n    const types=['St','Ave','Ln','Dr','Blvd'];\n    const parts=(raw||'').split(',').map(x=>x.trim()).filter(Boolean);\n    const first=parts[0]||(raw||'').trim();\n    const m=first.match(/^\\s*(\\d+)\\s+(.*)$/);\n    const h=this.hash((raw||'').toLowerCase());\n    const num=m?m[1]:String(100+(h%8900));\n    let name=(m?m[2]:first).trim().replace(/\\s+/g,' ');\n    if(!name) return [];\n    name=name.replace(/\\b\\w/g,c=>c.toUpperCase());\n    // Honor a typed \"City, State\" rather than always assuming Austin.\n    const loc=parts.slice(1).join(', ').replace(/\\b\\w/g,c=>c.toUpperCase());\n    const cityLabel=loc||'Austin, TX';\n    const hasType=/\\b(st|street|ave|avenue|ln|lane|dr|drive|rd|road|blvd|way|ct|court|cir|circle|pkwy|pkway|trl|trail|cv|cove)\\.?$/i.test(name);\n    const out=[];\n    if(hasType){ out.push(`${num} ${name}`); }\n    else { for(let i=0;i<3;i++){ out.push(`${num} ${name} ${types[(h+i)%types.length]}`); } }\n    return out.map((line,i)=>({ line, city:cityLabel, zip:'', lng:-97.74-(i*0.01), lat:30.25+(i*0.01), synth:true }));\n  }\n  // ---- Simulated Rentcast property lookup ----\n  // In production: GET api.rentcast.io/v1/properties + /v1/avm/value  (header X-Api-Key)\n  rentcast(g){\n    if(!g) return null;\n    if(g.synth){\n      // Unknown address → deterministic-ish plausible data, but flag some as not-found\n      if(/\\bpo box\\b/i.test(g.line)) return null;\n      const h = Array.from(g.line).reduce((n,c)=>n+c.charCodeAt(0),0);\n      return { beds: 2+(h%3), baths: 1+(h%2), sqft: 1000+(h%9)*120, year: 1955+(h%60), type:'Single Family', value: 320000+(h%22)*9000 };\n    }\n    return { beds:g.beds, baths:g.baths, sqft:g.sqft, year:g.year, type:g.type, value:g.value };\n  }\n\n  // ================= Real Rentcast integration (via Supabase) =================\n  // The Rentcast API key lives ONLY in the Supabase edge function (never in the\n  // client). Deploy the 'rentcast-lookup' function + cache table, and lookups go\n  // live automatically. Until then, or if the cap is hit, lookups fall back to\n  // simulated data (0 real calls). Global cache + monthly cap are enforced server-side.\n  rentcastCfg(){\n    const c=this.sbCfg();\n    return { fn: c.url+'/functions/v1/rentcast-lookup', key: c.key };\n  }\n  _rcCacheGet(addr){ try{ const j=localStorage.getItem('co_rc_cache_'+addr.toLowerCase().trim()); return j?JSON.parse(j):null; }catch(e){ return null; } }\n  _rcCacheSet(addr,d){ try{ localStorage.setItem('co_rc_cache_'+addr.toLowerCase().trim(), JSON.stringify(d)); }catch(e){} }\n  // Ask the Supabase function for property details. It holds the key, serves a shared\n  // cache (repeat addresses cost 0), and stops calling Rentcast once 45/mo is reached.\n  async fetchRentcast(g){\n    const addr=(g&&(g.label||g.line))||'';\n    if(!addr) return this.rentcast(g);\n    const local=this._rcCacheGet(addr);\n    if(local) return local;                       // instant on repeat, no network\n    const cfg=this.rentcastCfg();\n    try{\n      const res=await fetch(cfg.fn, { method:'POST',\n        headers:{ 'Content-Type':'applic q);\n    if((this.state.geoQuery||'').trim()===q) this.setState({ geoResults: out });\n  }\n  // Selecting an address → store coords → auto-run Rentcast\n  pickAddress(g){\n    const parts=(g.city||'').split(',');\n    const stateAbbr=(parts.length>1?parts[parts.length-1]:'').trim();\n    const cityName=(parts.length>1?parts.slice(0,-1).join(','):(g.city||'')).trim();\n    this.setState(st=>({\n      geoQuery:g.label, geoResults:[], geoFocused:false, rentStatus:'loading', addrExpanded:true,\n      subDraft:{...st.subDraft, address:g.label, unit:'', city:cityName, state:stateAbbr, zip:g.zip, country:'United States', coords:{lng:g.lng,lat:g.lat}}\n    }));\n    clearTimeout(this._rent);\n    this._rent = setTimeout(async ()=>{\n      let data;\n      try{ data = await this.fetchRentcast(g); }catch(e){ data = this.rentcast(g); }\n      if(!data){ this.setState({rentStatus:'notfound'}); return; }\n      this.setState(st=>({\n        rentStatus:'done',\n        subDraft:{...st.subDraft, beds:String(data.beds), baths:String(data.baths), sqft:String(data.sqft),\n          year:String(data.year), type:data.type, estValue:data.value,\n          ask: st.subDraft.ask || String(Math.round(data.value*0.9/1000)*1000), rentcastFilled:true }\n      }));\n    }, 250);\n  }\n  subQuality(d){\n    if(!d) return 0; let n=0;\n    if(d.address) n+=14; if(d.beds&&d.baths&&d.sqft) n+=16; if(d.ask) n+=10;\n    if((d.photos||0)>=5) n+=22; else if((d.photos||0)>0) n+=10;\n    if(d.timeline) n+=8; if(d.conditionNotes&&d.conditionNotes.length>20) n+=14;\n    if(d.summary) n+=9; if(d.repairEstimate) n+=7;\n    return Math.min(100,n);\n  }\n\n  // ---- Real AI draft via Claude (Prompt 3) with graceful fallback ----\n  // field: 'summary' | 'repair' | undefined (both). Only the requested field is written.\n  _applyDraft(field, vals){\n    this.setState(st=>{\n      const next={...st.subDraft};\n      if(field!=='repair' && vals.summary) next.summary = vals.summary;\n      if(field!=='summary' && v
