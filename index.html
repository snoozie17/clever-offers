er the next few seconds\n    this._nbTimers = this._nbTimers || [];\n    cfg.forEach((c,i)=>{\n      const t = setTimeout(()=>{\n        const rng = c.lo + Math.random()*(c.hi-c.lo);\n        const offer = Math.round((estValue||420000)*rng/500)*500;\n        this.setState(st=>{\n          const cur = (st.nb[listingId]||[]).map(r=> r.buyer===c.buyer ? {...r, status:'received', offer} : r);\n          return { nb:{...st.nb, [listingId]:cur} };\n        }, ()=>{ if(persist) this.persistNB(listingId); });\n      }, 1600 + i*1500);\n      this._nbTimers.push(t);\n    });\n  }\n\n  // ---- Live injection into agent feed + investor matches (Prompt 4) ----\n  synthPool(){\n    return [\n      { address:'2405 Thrush Ln', city:'Austin, TX', zip:'78745', beds:3, baths:2, sqft:1490, value:452000, by:'Priya Nair' },\n      { address:'914 Vargas Rd',  city:'Austin, TX', zip:'78741', beds:4, baths:2, sqft:1720, value:398000, by:'Devon Carter' },\n      { address:'508 Terrace Dr',  city:'Austin, TX', zip:'78704', beds:2, baths:2, sqft:1180, value:511000, by:'Homeowner (self-serve)' },\n      { address:'3721 Fontana Dr', city:'Austin, TX', zip:'78725', beds:3, baths:2, sqft:1560, value:365000, by:'Marcus Reed' },\n      { address:'6100 Wilcab Rd',  city:'Austin, TX', zip:'78721', beds:3, baths:1, sqft:1210, value:389000, by:'Homeowner (self-serve)' },\n    ];\n  }\n  makeHomeFrom(p, extra){\n    const ask = extra.ask || Math.round(p.value*0.9/1000)*1000;\n    const arv = Math.round(p.value*1.08/1000)*1000;\n    const rehab = extra.rehab || Math.round((p.value*0.12)/1000)*1000;\n    const score = 78 + Math.floor(Math.random()*20);\n    return {\n      id:'h'+Date.now()+Math.floor(Math.random()*999),\n      address:p.address, city:p.city, zip:p.zip, beds:p.beds, baths:p.baths, sqft:p.sqft,\n      type:extra.type||'Single Family', year:extra.year||1970,\n      ask, arv, rehab, arvPct:Math.round(ask/arv*100), daysListed:0, offersCount:0, photo:'home exterior',\n      listedBy:p.by, condition:extra.condition||'Cosmetic', matchScore:score, pipeline:'new', offerDue:'in 5 days',\n      timeline:extra.timeline||'Flexible',\n      conditionNotes:extra.conditionNotes||'Submitted moments ago. Agent enriching condition detail now.',\n      propertySummary:extra.summary||'Freshly submitted listing package. Full investor detail is being enriched by the agent.',\n      repairHighlights:[], investorSummary:extra.summary||'', tags:['Just listed','Cash buyer'],\n      docs:[], comps:this.rentcastComps({address:p.address, sqft:p.sqft, value:p.value, arv:arv, ask:ask}), estValue:p.value,\n    };\n  }\n  // ---- Stock imagery (deterministic per address, so a home always shows the same photo) ----\n  imgList(){\n    return {\n      ext:[\n        'https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1576941089067-2de3c901e126?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1598228723793-52759bba239c?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1592595896551-12b371d546d5?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600585152220-90363fe7e115?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1512915922686-57c11dde9b6b?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1449844908441-8829872d2607?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?auto=format&fit=crop&w=800&q=70'\n      ],\n      intr:[\n        'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1567767292278-a4f21aa2d36e?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600210492493-0946911123ea?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=800&q=70',\n        'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=70'\n      ]\n    };\n  }\n  imgFor(seed){\n    const key=String(seed||'');\n    this._extAssign = this._extAssign || {};\n    if(this._extAssign[key]) return this._extAssign[key];\n    const pool=this.imgList().ext;\n    const used=new Set(Object.values(this._extAssign));\n    const start=this.hash(key)%pool.length;\n    let pick=pool[start];\n    for(let k=0;k<pool.length;k++){ const c=pool[(start+k)%pool.length]; if(!used.has(c)){ pick=c; break; } }\n    this._extAssign[key]=pick;\n    return pick;\n  }\n  interiorFor(seed,i){ const l=this.imgList().intr; return l[(this.hash(String(seed||''))*7+(i||0)*3)%l.length]; }\n  synthUniqueListing(used){\n    const streets=['Maple Grove Ct','Sunset Ridge Rd','Alder Creek Dr','Camino Real','Post Oak Blvd','Birch Hollow Ln','Verano Way','Shoal Bend Dr','Pecan Grove Trl','Meridian Park Ln','Windsor Field Rd','Cypress Point Cv'];\n    const cities=[['Austin, TX','78704'],['Austin, TX','78745'],['Austin, TX','78721'],['Round Rock, TX','78664'],['Pflugerville, TX','78660'],['Kyle, TX','78640']];\n    const bys=['Homeowner (self-serve)','Priya Nair','Marcus Reed','Devon Carter','Sarah Chen'];\n    for(let t=0;t<60;t++){\n      const addr=(100+Math.floor(Math.random()*8900))+' '+streets[Math.floor(Math.random()*streets.length)];\n      if(!used.has(addr)){\n        const c=cities[Math.floor(Math.random()*cities.length)];\n        return { address:addr, city:c[0], zip:c[1], beds:2+Math.floor(Math.random()*3), baths:1+Math.floor(Math.random()*3),\n          sqft:980+Math.floor(Math.random()*22)*60, value:310000+Math.floor(Math.random()*26)*9000, by:bys[Math.floor(Math.random()*bys.length)] };\n      }\n    }\n    return { address:'New Listing '+Date.now(), city:'Austin, TX', zip:'78704', beds:3, baths:2, sqft:1400, value:400000, by:'Homeowner (self-serve)' };\n  }\n  injectListing(fromNetwork){\n    const pool = this.synthPool();\n    const used = new Set((this.state.homes||[]).map(h=>h.address));\n    const open = pool.filter(p=>!used.has(p.address));\n    const p = open.length ? open[Math.floor(Math.random()*open.length)] : this.synthUniqueListing(used);\n    const timelines=['ASAP','Within 30 days','30\\u201345 days','60 days','Flexible'];\n    const home = this.makeHomeFrom(p, { timeline: timelines[Math.floor(Math.random()*timelines.length)] });\n    const feed = { id:'f'+home.id, homeId:home.id, address:home.address, city:home.city+' '+home.zip,\n      beds:home.beds, baths:home.baths, sqft:home.sqft, ask:home.ask, matchScore:home.matchScore, offers:0,\n      by:p.by, at:Date.now(), live:true };\n    this.setState(st=>({\n      homes:[home, ...st.homes],\n      liveFeed:[feed, ...st.liveFeed].slice(0,8),\n      newMatchIds:[home.id, ...st.newMatchIds],\n    }));\n    this.requestNationalBuyers(home.id, p.value);\n    if(fromNetwork && this.state.screen==='investor') this.flash('New match just hit your dashboard.');\n  }\n\n  // ---- Submit the wizard: go live everywhere at once (Prompt 4) ----\n  submitListing(){\n    const d = this.state.subDraft;\n    if(!d || !d.address){ this.setState({subStep:0}); this.flash('Enter and select an address first.'); return; }\n    if((d.photos||0)<1 && !this.state.subFromHome){ this.setState({subStep:2}); this.flash('Add at least one photo before submitting.'); return; }\n    const p = { address:d.address, city:d.city||'Austin, TX', zip:d.zip||'78704', beds:Number(d.beds)||3,\n      baths:Number(d.baths)||2, sqft:Number(d.sqft)||1400, value:d.estValue||Number(d.ask)*1.1||420000,\n      by: this.state.subRole==='agent' ? 'Sarah Chen' : 'Maria Delgado (self-serve)' };\n    const home = this.makeHomeFrom(p, { ask:Number(d.ask), type:d.type, year:Number(d.year), condition:d.condition,\n      timeline:d.timeline, conditionNotes:d.conditionNotes, summary:d.summary });\n    home.matchScore = this.subQuality(d)>=70 ? 92 : 84;\n    const feed = { id:'f'+home.id, homeId:home.id, address:home.address, city:home.city+' '+home.zip,\n      beds:home.beds, baths:home.baths, sqft:home.sqft, ask:home.ask, matchScore:home.matchScore, offers:0,\n      by:p.by, at:Date.now(), live:true, mine:true };\n    const shRow = { id:'sh'+home.id, address:home.address, city:home.city+' '+home.zip, status:'With advisor', agreement:'not-started',\n      photo:'home exterior', listed:'Submitted just now', detail:'Sarah Chen is reviewing & preparing to shop your listing',\n      beds:home.beds, baths:home.baths, sqft:home.sqft };\n    const sellerId = 's'+home.id;\n    const isSeller = this.state.subRole==='seller';\n    this.setState(st=>{\n      const next = { subOpen:false, subDraft:null, subStep:0 };\n      if(st.subRole==='seller'){\n        // Seller path: listing goes to a matched advisor to review, enrich & shop — not live to investors yet.\n        next.sellerHomes = [shRow, ...st.sellerHomes]; next.sellerTab='homes';\n        next.sellers = [{ id:sellerId, leadName:'Self-submitted seller', name:home.address, address:home.address,\n          city:home.city+' '+home.zip, daysListed:0, hasPackage:true, packageStatus:'in-progress', quality:this.subQuality(st.subDraft),\n          pendingDecision:false, agreement:'not-started', timeline:home.timeline, beds:home.beds, baths:home.baths, sqft:home.sqft, type:home.type,\n          year:home.year, ask:home.ask, arv:home.arv, rehab:home.rehab, photo:'home exterior', phone:'(512) 555-0110',\n          email:'seller@email.com', offers:[] }, ...st.sellers];\n      }\n      else {\n        // Agent path: posting the listing matches it with buyers instantly and sends it to the national buyer program.\n        next.homes = [home, ...st.homes];\n        next.liveFeed = [feed, ...st.liveFeed].slice(0,8);\n        next.newMatchIds = [home.id, ...st.newMatchIds];\n        next.sellers = [{ id:sellerId, leadName:'New client', name:home.address, address:home.address,\n          city:home.city+' '+home.zip, daysListed:0, hasPackage:true, packageStatus:'published', quality:this.subQuality(st.subDraft),\n          pendingDecision:false, agreement:'complete', timeline:home.timeline, beds:home.beds, baths:home.baths, sqft:home.sqft, type:home.type,\n          year:home.year, ask:home.ask, arv:home.arv, rehab:home.rehab, photo:'home exterior', phone:'(512) 555-0100',\n          email:'client@email.com', offers:[] }, ...st.sellers];\n      }\n      return next;\n    });\n    // Persist the freshly submitted listing to Supabase (real insert).\n    this.sbWrite('listings', { method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify({ id:home.id, payload:home, source:'submitted' }) });\n    if(isSeller){\n      this.flash('Listing sent. A Clever advisor will review it, enrich your package, and shop it to competing buyers.');\n    } else {\n      // key national buyer requests by the id the offer views look up (seller id)\n      this.requestNationalBuyers(sellerId, p.value, true);\n      this.flash('Listing is live. Matched with buyers and sent to the national buyer program.');\n    }\n  }\n\n  // ===== LISTING PACKAGE BUILDER HELPERS =====\n  investorContacts(){\n    return [\n      { id:'inv1', name:'Marcus Webb', org:'Lonestar Capital Group', role:'Investor', phone:'(512) 555-0142', email:'marcus@lonestarcap.com' },\n      { id:'inv2', name:'Dana Pruitt', org:'Hill Country Holdings', role:'Investor', phone:'(512) 555-0198', email:'dana@hchold.com' },\n      { id:'inv3', name:'Evan Cho', org:'BlueRock Property Partners', role:'Investor', phone:'(512) 555-0121', email:'evan@bluerockpp.com' }\n    ];\n  }\n  sendAgentMessage(id){\n    const t=((this.state.agentMsgDrafts||{})[id]||'').trim(); if(!t) return;\n    this.setState(st=>({\n      agentThreads:{...st.agentThreads, [id]:[...(st.agentThreads[id]||[]), {from:'me',text:t}]},\n      agentMsgDrafts:{...st.agentMsgDrafts, [id]:''}\n    }));\n    this.flash('Message sent.');\n  }\n  sendComposer(id){\n    const t=(this.state.agentComposer||'').trim(); if(!t||!id) return;\n    this.setState(st=>({ agentThreads:{...st.agentThreads,[id]:[...(st.agentThreads[id]||[]),{from:'me',text:t}]}, agentComposer:'' }));\n    clearTimeout(this._amt);\n    this._amt=setTimeout(()=>this.setState(st=>({ agentThreads:{...st.agentThreads,[id]:[...(st.agentThreads[id]||[]),{from:'them',text:'Thanks Sarah, got it. Talk soon.'}]} })),1200);\n  }\n  agreementView(status){    const map={\n      'complete':{short:'Complete', color:'#0a8f60', bg:'#E7F7F0', dot:'#00B67A'},\n      'in-progress':{short:'In progress', color:'#C9781A', bg:'#FFF1DF', dot:'#F4A23B'},\n      'not-started':{short:'Not started', color:'#8593ab', bg:'#EEF2F8', dot:'#c3cddd'}\n    };\n    return map[status||'not-started']||map['not-started'];\n  }\n  advanceAgreement(id){\n    let msg='';\n    this.setState(st=>({ sellers: st.sellers.map(x=>{\n      if(x.id!==id) return x;\n      const nextStatus=(x.agreement||'not-started')==='not-started'?'in-progress':'complete';\n      msg = nextStatus==='in-progress' ? 'Listing agreement sent to the seller for signature.' : 'Agreement marked as signed. You can now build the package.';\n      return {...x, agreement:nextStatus};\n    }) }));\n    if(msg) this.flash(msg);\n  }\n  openBuilder(id){\n    const x=this.state.sellers.find(y=>y.id===id)||{};\n    if((x.agreement||'not-started')!=='complete'){ this.flash('A signed listing agreement is required before you can build or edit this package.'); return; }\n    // Agents build packages through the same address-first flow homeowners use.\n    this.openSubmission('agent', { seedAddress: x.address });\n    return;\n  }\n  openBuilderLegacy(id){\n    const x=this.state.sellers.find(y=>y.id===id)||{};\n    const has=x.packageStatus==='published';\n    const seed=this.seedHomes().find(h=>h.address===x.address)||{};\n    this.setState({ pkgEditorId:id, pkgStep:0, pkgDraft:{\n      address:x.address||'', type:x.type||'Single Family', beds:x.beds||'', baths:x.baths||'', sqft:x.sqft||'', year:x.year||'',\n      ask:x.ask||'', arv:x.arv||'', rehab:x.rehab||'', timeline:x.timeline||'', condition:x.condition||'Cosmetic',\n      conditionNotes: has?(seed.conditionNotes||''):'',\n      propertySummary: has?(seed.propertySummary||''):'', investorSummary: has?(seed.investorSummary||''):'',\n      repairHighlights: has?((seed.repairHighlights||[]).join('; ')):'', tags: has?(seed.tags||[]):[], comps: has?(seed.comps||[]):[],\n      photos: has?7:0, docs: has?['Seller Disclosure.pdf','Signed Purchase Agreement.pdf']:[]\n    }});\n  }\n  pkgSet(k,v){ this.setState(st=>({ pkgDraft:{...st.pkgDraft, [k]:v} })); }\n  applyImport(){\n    this.setState(st=>({ pkgStep:1, pkgDraft:{...st.pkgDraft,\n      type:'Single Family', beds:st.pkgDraft.beds||'3', baths:st.pkgDraft.baths||'2',\n      sqft:st.pkgDraft.sqft||'1560', year:st.pkgDraft.year||'1968', ask:st.pkgDraft.ask||'385000',\n      arv:st.pkgDraft.arv||'520000', timeline:st.pkgDraft.timeline||'ASAP', photos:Math.max(5,st.pkgDraft.photos||0)\n    }}));\n  }\n  computeQuality(d){\n    if(!d) return 0;\n    let n=0;\n    if(d.address) n+=8; if(d.ask) n+=10; if(d.type&&d.beds&&d.baths&&d.sqft) n+=12;\n    if(d.timeline) n+=8; if((d.photos||0)>=5) n+=20; else if((d.photos||0)>0) n+=8;\n    if(d.conditionNotes && d.conditionNotes.length>20) n+=12; if((d.comps||[]).length>=3) n+=15;\n    if(d.rehab) n+=5; if(d.propertySummary) n+=5; if((d.tags||[]).length>0) n+=3; if(d.investorSummary) n+=2;\n    return Math.min(100,n);\n  }\n  aiSummary(d){\n    const bd=d.beds||'3', ba=d.baths||'2', t=(d.type||'home').toLowerCase();\n    return `Well-positioned ${bd}/${ba} ${t} with ${d.condition==='Heavy'?'a full-scope rehab opportunity':'primarily cosmetic updates needed'}. Motivated seller on a ${d.timeline||'flexible'} timeline. Strong comparable support in the immediate area makes this a clean cash acquisition with a defined exit.`;\n  }\n  aiRepairs(d){\n    return d.condition==='Heavy'\n      ? 'Foundation stabilization; full roof replacement; electrical & plumbing update; kitchen & bath gut; cosmetic + landscaping.'\n      : 'Flooring throughout; kitchen refresh (cabinets/counters); bath cosmetics; interior & exterior paint; landscaping & curb appeal.';\n  }\n  aiInvSummary(d){\n    const arv=Number(d.arv)||0, ask=Number(d.ask)||0, rehab=Number(d.rehab)||0;\n    const allIn=ask+rehab, margin=arv?Math.round((arv-allIn)/arv*100):0;\n    return `ARV ${this.money(arv)} supported by 3 nearby comps. At ${this.money(ask)} + ~${this.money(rehab)} rehab, all-in ~${this.money(allIn)} leaves ~${margin}% projected margin before holding costs. Seller motivated on a ${d.timeline||'flexible'} timeline.`;\n  }\n  aiTags(d){\n    const t=[]; t.push(d.condition==='Heavy'?'Heavy rehab':'Cosmetic rehab');\n    t.push('Motivated seller'); t.push('Below ARV');\n    if((d.timeline||'').toLowerCase().includes('asap')) t.push('Fast close');\n    t.push('As-is OK'); return t;\n  }\n  // ---- Simulated Rentcast Sold Property Comps (recent nearby sales) ----\n  // In production: GET api.rentcast.io/v1/listings/sale + /v1/avm/value with comparables\n  rentcastComps(h){\n    if(!h) return [];\n    const key=String(h.address||h.line||'comp');\n    const seed=this.hash(key);\n    const streets=['Oakmont Dr','Larkspur Ln','Cedar Bend','Vista Verde','Shadow Creek Dr','Marigold Way','Ridgeline Ct','Brookhaven Dr','Camino Alto','Sable Ridge','Wren Hollow','Pinehurst Ct'];\n    const months=['Apr 2026','Mar 2026','Feb 2026','Jan 2026','Dec 2025','Nov 2025'];\n    const baseSq=Number(h.sqft)||1500;\n    const baseVal=Number(h.estValue||h.value||h.arv||h.ask)||460000;\n    const n=2+(seed%2);\n    const out=[];\n    for(let i=0;i<n;i++){\n      const hh=this.hash(key+'#'+i);\n      const num=100+(hh%8900);\n      const st=streets[(seed+i)%streets.length];\n      out.push({\n        addr:num+' '+st,\n        sqft:baseSq + (((hh%9)-4)*35),\n        sold:months[hh%months.length],\n        price:Math.round((baseVal*(0.93+((hh%14)/100)))/1000)*1000,\n        dist:(0.1+((hh%5)*0.1)).toFixed(1)+' mi'\n      });\n    }\n    return out;\n  }\n  aiComps(d){\n    const base=Number(d.arv)||520000, sq=Number(d.sqft)||1560;\n    return [\n      {addr:'Comparable · 0.2 mi', sqft:sq+30, sold:'Mar 2026', price:base-8000, dist:'0.2 mi'},\n      {addr:'Comparable · 0.3 mi', sqft:sq-60, sold:'Feb 2026', price:base+8000, dist:'0.3 mi'},\n      {addr:'Comparable · 0.4 mi', sqft:sq+60, sold:'Jan 2026', price:base-1000, dist:'0.4 mi'},\n    ];\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
